[project]
name = "sorento-crm-mcp"
version = "0.1.0"
description = "Read-only MCP server proxying Sorento CRM /api/v1 GET APIs for n8n and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
sorento-crm-mcp = "sorento_crm_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sorento_crm_mcp*"]
