[project]
name = "sorento-crm-mcp"
version = "0.1.0"
description = "Read-only MCP server proxying Sorento CRM /api/v1 GET APIs for n8n and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Cap at <2: mcp 2.0.0 REMOVED `mcp.server.fastmcp` (FastMCP moved out of the
    # SDK), and server.py imports `Context, FastMCP` from it. The unpinned
    # `mcp>=1.2.0` resolved to 2.0.0 the day it released, so the deploy build
    # produced an image whose container crashlooped on
    # "ModuleNotFoundError: No module named 'mcp.server.fastmcp'" while the
    # cached CI validation image still had 1.x and passed. Moving to FastMCP 2.x
    # is a real migration (new package, changed API), not a version bump.
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
sorento-crm-mcp = "sorento_crm_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sorento_crm_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
