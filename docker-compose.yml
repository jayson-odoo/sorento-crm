x-mcp-base: &mcp-base
  build:
    context: ./sorento_crm_mcp
    dockerfile: Dockerfile
  image: jayson1004/sorento-crm:mcp-${IMAGE_TAG:-1.0.1}
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  networks:
    - sorento_network
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8765)); s.close()\" || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  # ---------------- Infra (NOT blue/green) ----------------
  db:
    image: pgvector/pgvector:pg17
    container_name: sorento_crm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sorento_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cirnah-Xuspin-tafry1}
      POSTGRES_DB: ${POSTGRES_DB:-sorento_ai_automation}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c max_connections=500
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c random_page_cost=1.1
      -c log_min_duration_statement=200
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sorento_network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sorento_crm_pgbouncer
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-sorento_crm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cirnah-Xuspin-tafry1}
      DB_NAME: ${POSTGRES_DB:-sorento_ai_automation}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sorento_network

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: sorento_ai_automation
      POSTGRES_USER: sorento_crm
      POSTGRES_PASSWORD: cirnah-Xuspin-tafry1
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - sorento_network

  redis:
    image: redis:7-alpine
    container_name: sorento_crm_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sorento_network
    command: redis-server --appendonly yes

  # ---------------- Worker (NOT blue/green; recreated in place each deploy) ----------------
  # Runs RQ queue draining + APScheduler. Single instance owns all cron ticks.
  # API containers MUST have ENABLE_SCHEDULER=false (default) so only this process fires jobs.
  worker:
    build:
      context: ./sorento_crm_backend
      dockerfile: Dockerfile
    image: jayson1004/sorento-crm:backend-${IMAGE_TAG:-1.0.1}
    container_name: sorento_crm_worker
    env_file:
      - ./sorento_crm_backend/.env
    environment:
      <<: *backend-env
      ENABLE_SCHEDULER: "true"
    command: ["python", "worker.py"]
    depends_on:
      - redis
      - pgbouncer
    restart: unless-stopped
    networks:
      - sorento_network

  # ---------------- Backend blue/green ----------------
  backend_blue:
    <<: *backend-base
    profiles: ["blue"]
    environment:
      <<: *backend-env
      ENABLE_SCHEDULER: "false"
    ports:
      - "127.0.0.1:8000:8000"

  backend_green:
    <<: *backend-base
    profiles: ["green"]
    environment:
      <<: *backend-env
      ENABLE_SCHEDULER: "false"
    ports:
      - "127.0.0.1:8010:8000"

  # ---------------- Frontend blue/green ----------------
  frontend_blue:
    <<: *frontend-base
    profiles: ["blue"]
    environment:
      <<: *frontend-env
    ports:
      - "127.0.0.1:3000:3000"

  frontend_green:
    <<: *frontend-base
    profiles: ["green"]
    environment:
      <<: *frontend-env
    ports:
      - "127.0.0.1:3010:3000"

  # ---------------- MCP blue/green ----------------
  # n8n hits http://72.62.195.20:8765 (host nginx). Nginx upstream sorento_mcp
  # points at the active color's 127.0.0.1:<port>. Container ports never face public.
  mcp_blue:
    <<: *mcp-base
    profiles: ["blue"]
    environment:
      <<: *mcp-env
    ports:
      - "127.0.0.1:8766:8765"

  mcp_green:
    <<: *mcp-base
    profiles: ["green"]
    environment:
      <<: *mcp-env
    ports:
      - "127.0.0.1:8776:8765"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sorento_network:
    driver: bridge
