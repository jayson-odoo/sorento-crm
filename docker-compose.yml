version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sorento_crm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-sorento_ai_automation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sorento_network

  # FastAPI Backend
  backend:
    build:
      context: ./sorento_crm_backend
      dockerfile: Dockerfile
    container_name: sorento_crm_backend
    environment:
      # Database - use environment variables to ensure password matches
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-sorento_ai_automation}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@72.62.195.20:5432/${POSTGRES_DB:-sorento_ai_automation}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@72.62.195.20:5432/${POSTGRES_DB:-sorento_ai_automation}
      
      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:-3f1c6d1f5e9b4d8c1a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f7081}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      
      # API Server
      API_HOST: 0.0.0.0
      API_PORT: 8000
      
      # CORS - Allow frontend to access backend
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://frontend}
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      
      # AWS S3 (if used for file storage)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIA3JCS3CX6TEDK3B4G}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-sorento-demo-bucket}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Optional: Mount for development (comment out in production)
      # - ./sorento_crm_backend/app:/app/app
      - backend_logs:/app/logs
    restart: unless-stopped
    networks:
      - sorento_network
    # use the image's ENTRYPOINT (/start.sh) – no long inline sh -c here

  # Next.js Frontend (served by Nginx)
  frontend:
    build:
      context: ./sorento_crm_frontend
      dockerfile: Dockerfile
    container_name: sorento_crm_frontend
    environment:
      # Database - Next.js needs direct DB access for NextAuth with PrismaAdapter
      # Use external database by default, or override with DATABASE_URL env var
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:root@72.62.195.20:5432/sorento_ai_automation?schema=public}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:-postgresql://postgres:root@72.62.195.20:5432/sorento_ai_automation?schema=public}}
      # API URL - empty for client-side (goes through nginx proxy), or full URL for server-side
      # Client-side requests will use relative paths that nginx proxies to backend
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      # NextAuth secret (must match JWT_SECRET if sharing tokens with backend)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${JWT_SECRET:-3f1c6d1f5e9b4d8c1a2b3c4d5e6f70819a2b3c4d5e6f70819a2b3c4d5e6f7081}}
      # NextAuth URL for callbacks
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - db
      - backend
    restart: unless-stopped
    networks:
      - sorento_network

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

networks:
  sorento_network:
    driver: bridge
