version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sorento_crm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sorento_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sorento_network

  # FastAPI Backend
  backend:
    build:
      context: ./sorento_crm_backend
      dockerfile: Dockerfile
    container_name: sorento_crm_backend
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/sorento_crm}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@db:5432/sorento_crm}
      
      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      
      # API Server
      API_HOST: 0.0.0.0
      API_PORT: 8000
      
      # CORS - Allow frontend to access backend
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://frontend}
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      
      # AWS S3 (if used for file storage)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Optional: Mount for development (comment out in production)
      # - ./sorento_crm_backend/app:/app/app
      - backend_logs:/app/logs
    restart: unless-stopped
    networks:
      - sorento_network
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        until pg_isready -h db -U ${POSTGRES_USER:-postgres}; do
          sleep 2
        done &&
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting FastAPI server...' &&
        gunicorn app.main:app \
          --workers 4 \
          --worker-class uvicorn.workers.UvicornWorker \
          --bind 0.0.0.0:8000 \
          --timeout 120 \
          --keep-alive 5 \
          --access-logfile - \
          --error-logfile -
      "

  # Next.js Frontend (served by Nginx)
  frontend:
    build:
      context: ./sorento_crm_frontend
      dockerfile: Dockerfile
    container_name: sorento_crm_frontend
    environment:
      # API URL - points to backend service
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sorento_network

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

networks:
  sorento_network:
    driver: bridge

# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
#
# 1. BUILD AND START SERVICES
#    -------------------------
#    Build all services:
#      docker compose build
#
#    Start all services in detached mode:
#      docker compose up -d
#
#    View logs:
#      docker compose logs -f
#
#    Stop services:
#      docker compose down
#
#    Stop and remove volumes (WARNING: deletes database data):
#      docker compose down -v
#
#
# 2. ACCESS URLS
#    -----------
#    Frontend UI:        http://localhost
#    Backend API:        http://localhost:8000
#    API Documentation: http://localhost:8000/docs (Swagger UI)
#    API ReDoc:          http://localhost:8000/redoc
#    Health Check:       http://localhost:8000/health
#
#
# 3. ENVIRONMENT VARIABLES
#    ---------------------
#    Create a .env file in the root directory (sorento_crm/) with:
#
#    # Database
#    POSTGRES_USER=postgres
#    POSTGRES_PASSWORD=postgres
#    POSTGRES_DB=sorento_crm
#    POSTGRES_PORT=5432
#
#    # Backend
#    DATABASE_URL=postgresql://postgres:postgres@db:5432/sorento_crm
#    DIRECT_URL=postgresql://postgres:postgres@db:5432/sorento_crm
#    JWT_SECRET=your-secret-key-change-in-production
#    JWT_ALGORITHM=HS256
#    CORS_ORIGINS=http://localhost,http://frontend
#    ENVIRONMENT=production
#    DEBUG=false
#
#    # Frontend
#    NEXT_PUBLIC_API_URL=http://localhost:8000
#    NEXT_PUBLIC_BASE_PATH=
#
#    # Ports (optional, defaults shown)
#    FRONTEND_PORT=80
#    BACKEND_PORT=8000
#
#    # AWS S3 (if using file storage)
#    AWS_ACCESS_KEY_ID=your-access-key
#    AWS_SECRET_ACCESS_KEY=your-secret-key
#    AWS_REGION=us-east-1
#    AWS_S3_BUCKET=your-bucket-name
#
#
# 4. DATABASE MIGRATIONS
#    -------------------
#    Migrations run automatically on backend startup.
#    To run manually:
#      docker compose exec backend alembic upgrade head
#
#
# 5. TROUBLESHOOTING
#    ---------------
#    Check service status:
#      docker compose ps
#
#    View backend logs:
#      docker compose logs backend
#
#    View frontend logs:
#      docker compose logs frontend
#
#    View database logs:
#      docker compose logs db
#
#    Access backend shell:
#      docker compose exec backend sh
#
#    Access database:
#      docker compose exec db psql -U postgres -d sorento_crm
#
#    Rebuild after code changes:
#      docker compose build --no-cache
#      docker compose up -d
#
#
# 6. PRODUCTION CONSIDERATIONS
#    -------------------------
#    - Change JWT_SECRET to a strong random value
#    - Set DEBUG=false
#    - Use environment-specific CORS_ORIGINS
#    - Configure proper database backups
#    - Set up SSL/TLS (use reverse proxy like Traefik or Nginx)
#    - Configure resource limits (memory, CPU)
#    - Use secrets management for sensitive data
#    - Enable database connection pooling
#    - Monitor logs and set up alerting
