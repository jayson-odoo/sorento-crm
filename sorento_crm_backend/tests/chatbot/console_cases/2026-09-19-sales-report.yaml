# Console cases for the chatbot sales report journey (AC-1671).
#
# `documentation/plans/chatbot/PLAN-chatbot-sales-report.md` / `chatbot-sales-report-acceptance-
# criteria.md`, the "Journey" section and rulings S1-S18. Written test-FIRST (Phase 2 tester),
# authored before this lane's own stack exists - NOT run yet. Every expectation below is
# STRUCTURAL (header lines, block labels, the offer sentence, which report shape came back) and
# never pinned to a specific money figure, so the file holds on any prod copy carrying the
# HANLIM / SRTWT7445 data the plan's own "Measured" section describes.
#
# NOT collected by pytest. Run against the lane stack once the coder reports it green:
#
#   cd sorento_crm_backend
#   venv/bin/python scripts/chatbot_console_check.py \
#       tests/chatbot/console_cases/2026-09-19-sales-report.yaml \
#       --base-url http://127.0.0.1:<lane backend port> --sleep-seconds 8
#
# `--sleep-seconds 8` per the OpenAI TPM 429 lesson (chatbot-verification.md) - a graded run
# shares the parser's OpenAI key with anyone testing live at the same time. Export
# EXTERNAL_API_KEY from the backend .env before running. Evidence (the console log, plus the
# SQL probe AC-1672 asks for separately) goes under `documentation/plans/chatbot/evidence/
# sales-report/` (new directory, following the `evidence/outstanding-report/` precedent).
#
# PREREQUISITES before this file is run:
# - The contact below (437264483, the same contact the outstanding-report console files use)
#   holds the NEW per-contact field-reveal key `sales_orders.sales_report` (Contacts > Access >
#   "Sales report" - S10). It is a fresh key; nothing grants it by default.
# - Migration `519_chatbot_sales_report_vocab.py` has run (already present in this worktree at
#   authoring time) so the PUBLISHED `chatbot_semantic_parser` prompt version carries
#   `order_status: "sales_report"` and the `sales_channel` output key - the plain
#   `ai_prompt_versions` insert only reaches a live turn once the `production` label points at
#   it, same as every earlier prompt migration (475/480/487/490/514/517).
# - The MCP server has been restarted so `crm_sales_report` is in its synced `mcp_tools` catalog
#   (AC-1640) - the lane resolves the tool by name, and a stale catalog answers as if the tool
#   does not exist.
#
# GRAMMAR LIMITS the case designs below work around, or cannot (report these to the captain):
# - The runner's `expect` block has no `tool_name` / `tool_args` key at all (only `branch_kind`,
#   `reply_contains`, `reply_not_contains`, `no_uuid`, `pending_kind` - see `_grade` in
#   `scripts/chatbot_console_check.py`). The trace line that WOULD show `tool=crm_sales_report
#   args={"channel": "dealer", ...}` is only printed by `--say` mode (`_run_ad_hoc`), never by a
#   YAML case run (`_run_cases`). So "tool X called with arg Y" in the captain's list is graded
#   here by PROXY through the presenter's own header echo (the `Channel:` / `Delivery date:`
#   lines are built from exactly those tool args, per AC-1603/AC-1623/AC-1625) rather than
#   directly. A direct assertion would need a new `expect.tool_name` / `expect.tool_args` key on
#   the runner - out of this file's scope to add.
# - There is no "ends with" or "in this exact order" assertion; a case gets as close as
#   `reply_contains` allows by asserting a SINGLE multi-line needle spanning several
#   consecutive, data-INDEPENDENT lines (locks their relative order) plus separate needles for
#   lines whose CONTENT varies with data (so an order lock across them is not attempted).
# - There is no way to assert "no pending is armed" - `pending_kind` in `expect` is only checked
#   when truthy (`if wanted_pending and ...` in `_grade`), so `pending_kind: null` silently
#   asserts nothing. The DENIAL case below (AC-1651, "no offer is armed") cannot express that
#   half of its own contract through this grammar; it is covered instead by
#   `tests/chatbot/test_sales_report_lane.py`'s pytest suite with a fetch spy.
# - No regex / wildcard support, so "at least one `*_<Mon YYYY>_*` block" (any month) cannot be
#   asserted directly. Journey turns 1-3 below dodge this by explicitly narrowing to a NAMED
#   month ("june 2026 only") wherever the exact block title needs to be pinned; the one turn
#   left on "all dates" (the very first ask) is graded on the surrounding, month-name-
#   independent lines instead (`Sales orders:` / `Ordered: RM` / `Confirmed (DO): RM` /
#   `Outstanding: RM` / `*_By product_*`), not on the block title itself.
# - "hanlim" is assumed to resolve WITHOUT a customer-disambiguation picker (one company family,
#   several ledgers echoed together on one `Customer:` line - see the golden fixture
#   `documentation/plans/chatbot/samples/sales-report-customer.txt` line 1, and the precedent
#   `2026-09-14-outstanding-owner-rounds.yaml` R13/R24 cases, which hit "hanlim" directly with
#   no picker step under the SAME shared customer resolver). The plan's own Journey step 1 only
#   promises a picker "if 'hanlim' matches more than one company family" - the Measured
#   section's "6 ledgers" is one family, not six. If a picker appears on the live run instead,
#   insert an extra turn answering "all" right after the ask, before the header assertions
#   below - every case that opens with a bare "... for hanlim" ask carries this same risk.
# - SRTWT7445 is a literal product code (the plan's own "well-known code from the precedent
#   files" fallback), not a variable - the runner has no case-level templating/substitution
#   mechanism to hold a placeholder in.
# - S18's current-year default is hardcoded below as 2026 (today is 19 Sep 2026) because the
#   grammar is static YAML with no date arithmetic. BUMP EVERY JANUARY.
#
# The DENIAL case (last case below) uses the runner's own per-case `contact:` override (see
# `chatbot_console_check.py::_run_cases`, `contact = str(case.get("contact") or default_contact
# or "")`) rather than a second file. Its contact id is a PLACEHOLDER - substitute a real
# `respond_contacts` row that (a) has at least one stored `chatbot.turns.envelope` (the script's
# envelope-borrowing needs one) and (b) does NOT hold `sales_orders.sales_report`, verified via
# Contacts > Access or `contact_field_reveal_service.list_granted_keys` right before the run.

contact: "437264483"

cases:
  - name: Journey 1-4 - dealer sales report for hanlim, SO list, date narrow, product narrow
    cold: true
    turns:
      # 1. "give me the dealer sales report for hanlim" - Journey step 1-2. No date named =
      # all dates. Header in order Customer/Product/Channel/Location/Delivery date (AC-1601),
      # at least one month block (AC-1602), By product (customer subject, S6/AC-1604), closing
      # offer line (AC-1605), offer armed under its own kind (AC-1654, S11).
      - text: "give me the dealer sales report for hanlim"
        expect:
          branch_kind: business_query
          reply_contains:
            - "Customer:"
            - |-
              Product: all
              Channel: Dealer
              Location: all
              Delivery date: all
            - "Sales orders:"
            - "Ordered: RM"
            - "Confirmed (DO): RM"
            - "Outstanding: RM"
            - "*_By product_*"
            - "Reply 1 for the sales order list."
          reply_not_contains:
            - "Which customer do you mean?"
            - "Outstanding for which document?"
            - "No sales found."
          pending_kind: sales_report_detail
          no_uuid: true

      # 2. "1" - the detail offer answered. One numbered item per SO (AC-1606), no by-product
      # breakdown heading in a detail reply, offer stays sticky (AC-1655).
      - text: "1"
        expect:
          branch_kind: business_query
          reply_contains: ["*SO Number:*", "*Location:*", "*Order Date:*", "*Confirmed (DO):*"]
          reply_not_contains: ["*_By product_*", "*_By customer_*"]
          pending_kind: sales_report_detail
          no_uuid: true

      # 3. "june 2026 only" - a refinement narrows the SAME ask (customer/channel carried,
      # AC-1656) to one named month, so the block title itself is assertable for once
      # ("*_Jun 2026_*", not any month). Offer re-arms.
      - text: "june 2026 only"
        expect:
          branch_kind: business_query
          reply_contains:
            - "*_Jun 2026_*"
            - "Delivery date: 01/06/2026 to 30/06/2026"
            - "Channel: Dealer"
            - "Reply 1 for the sales order list."
          reply_not_contains: ["Delivery date: all", "Outstanding for which document?"]
          pending_kind: sales_report_detail
          no_uuid: true

      # 4. A product refinement on top - both customer AND product now named, so S6 prints NO
      # breakdown heading at all (neither By product nor By customer). Prior filters (channel,
      # narrowed date) stay carried.
      - text: "only SRTWT7445"
        expect:
          branch_kind: business_query
          reply_contains:
            - "Product: SRTWT7445"
            - "Delivery date: 01/06/2026 to 30/06/2026"
            - "Channel: Dealer"
          reply_not_contains: ["*_By product_*", "*_By customer_*"]
          pending_kind: sales_report_detail
          no_uuid: true

  - name: S18 - a product-only ask with no date defaults to the current calendar year
    cold: true
    turns:
      # Journey step 5. Product only (no customer) = By customer breakdown; no date named
      # defaults to the CURRENT YEAR (S18), unlike a customer ask which stays "all".
      - text: "sales report for SRTWT7445"
        expect:
          branch_kind: business_query
          reply_contains:
            - "Product: SRTWT7445"
            - "Channel: all"
            # Current calendar year (Malaysia time), today is 19 Sep 2026. BUMP EVERY JANUARY.
            - "Delivery date: 01/01/2026 to 31/12/2026"
            - "*_By customer_*"
          reply_not_contains: ["Delivery date: all"]
          no_uuid: true

  - name: S18 - saying "all dates" turns the current-year default off
    cold: true
    turns:
      # Journey step 5's escape hatch: naming "all dates" defeats the product-only default.
      - text: "sales report for SRTWT7445 all dates"
        expect:
          branch_kind: business_query
          reply_contains: ["Product: SRTWT7445", "Delivery date: all"]
          reply_not_contains: ["Delivery date: 01/01/2026 to 31/12/2026"]
          no_uuid: true

  - name: Journey 6 - project sales report for hanlim sets Channel Project
    cold: true
    turns:
      - text: "project sales report for hanlim"
        expect:
          branch_kind: business_query
          reply_contains: ["Channel: Project"]
          reply_not_contains: ["Channel: Dealer", "Channel: all", "Which customer do you mean?"]
          no_uuid: true

  - name: FUZZY - how much did hanlim buy this year reaches the sales report, not the orders list
    cold: true
    turns:
      # Proxy for "tool = crm_sales_report, dates = current year": the sales-report presenter's
      # OWN labels ("Sales orders:", "Confirmed (DO): RM") are absent from every other business
      # answer shape, and the current-year window is explicit in the message itself (not S18's
      # default), so it must reach the route regardless of subject shape.
      - text: "how much did hanlim buy this year"
        expect:
          branch_kind: business_query
          reply_contains:
            - "Sales orders:"
            - "Confirmed (DO): RM"
            - "Delivery date: 01/01/2026 to 31/12/2026"
          reply_not_contains:
            - "Sales order outstanding"
            - "Delivery order outstanding"
            - "Outstanding for which document?"
            - "*SO Number:*"
          no_uuid: true

  - name: "TRAP - dealer inside an outstanding ask is not read as a channel word"
    cold: true
    turns:
      # S8 is explicit that the outstanding report is unchanged by this lane: "dealer" binds
      # NOTHING there. This must still land on the outstanding scope question, never on
      # crm_sales_report (no Channel line at all - the outstanding presenter has none).
      - text: "dealer outstanding quantity for hanlim"
        expect:
          branch_kind: business_query
          reply_contains: ["Outstanding for which document?"]
          reply_not_contains:
            - "Sales orders:"
            - "Confirmed (DO):"
            - "*_By product_*"
            - "*_By customer_*"
            - "Channel: Dealer"
            - "Channel: Project"
          pending_kind: outstanding_scope
          no_uuid: true

  - name: "DENIAL - a contact without sales_orders.sales_report is refused before any fetch"
    # AC-1651/Journey step 7. Replace the contact id below (see the header PREREQUISITES note)
    # with a real, stored contact that has never been granted the key.
    contact: "445239415"
    cold: true
    turns:
      - text: "give me the dealer sales report for hanlim"
        expect:
          reply_contains: ["Sales report is not enabled for your account."]
          reply_not_contains:
            - "Which customer do you mean?"
            - "Customer:"
            - "Product:"
            - "Delivery date:"
            - "Sales orders:"
          no_uuid: true
