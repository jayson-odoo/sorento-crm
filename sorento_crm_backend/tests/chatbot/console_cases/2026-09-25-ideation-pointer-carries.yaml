# Console case for the tail-drops-the-pointer regression
# (`documentation/plans/chatbot/PLAN-chatbot-ideation-pointer-tail-25sep.md`, AC-4/AC-5).
#
# Proves: two REAL turns, in order, with NO injected `previous_conversation_state` - turn 1
# opens a draft, turn 2 is a question about a field the intake asked for, and turn 2 must
# still be graded `ideate`. The 24 Sep case
# (`2026-09-24-ideation-draft-keeps-lane.yaml`) injects the pointer by hand through
# `previous_conversation_state`, so it never exercises the tail's own write between two
# turns and cannot catch this bug: `run_tail` was writing `before.get("ideation")` (the
# value the turn STARTED with, always null on a fresh contact) instead of the pointer the
# ideate lane's own intake call just answered, so the second turn always arrived with no
# open draft.
#
# NOT collected by pytest. Run against a lane stack:
#
#   cd sorento_crm_backend
#   venv/bin/python scripts/chatbot_console_check.py \
#       tests/chatbot/console_cases/2026-09-25-ideation-pointer-carries.yaml \
#       --base-url http://127.0.0.1:<lane backend port> --mock-parser
#
# `--mock-parser` feeds each turn's `parser:` block below as the verdict, so the run grades
# the fix deterministically with no LLM call. Drop the flag to run the same two turns
# through the live parser (`--sleep-seconds 8` per the OpenAI TPM 429 lesson; export
# EXTERNAL_API_KEY from the backend .env first).
#
# The stack this runs against needs ideation actually configured (a default workspace row
# with `ideation_product_id` set) and the ideation shared service reachable at
# `IDEATION_SHARED_SERVICE_URL` - turn 1 calls the real intake tool, and an unconfigured or
# unreachable service answers `unconfigured` / `error` instead of opening a draft, which
# fails this case for an unrelated reason.

