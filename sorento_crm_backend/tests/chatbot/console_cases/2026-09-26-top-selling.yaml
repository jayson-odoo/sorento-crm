# Console cases kept from the chatbot top X hot selling journey (#1171, AC-1980).
#
# REPORT-SMART-L R4a (`documentation/plans/chatbot/PLAN-one-ranking-1023.md`): the top selling
# lane is retired from the chatbot, every item and category ranking runs on `crm_report_ask`,
# and its journey cases went with it. These two TRAP cases stay: an order list or a sales
# report ask is never taken for a ranking.
#
# NOT collected by pytest. Run against the lane stack with the REAL parser:
#
#   cd sorento_crm_backend
#   venv/bin/python scripts/chatbot_console_check.py \
#       tests/chatbot/console_cases/2026-09-26-top-selling.yaml \
#       --base-url http://127.0.0.1:<lane backend port> --sleep-seconds 8
#
# Export EXTERNAL_API_KEY from the backend .env first.
#
# PREREQUISITES: contact 900000008 holds the `sales_orders.sales_report` reveal key and is
# office staff (every access type it holds is an office type, e.g. "Sorento Office").

contact: "900000008"

cases:
  - name: TRAP - a plain top N on an order list stays an order list
    cold: true
    turns:
      - text: "last 3 DO for hanlim"
        expect:
          branch_kind: business_query
          reply_not_contains: ["selling items", "Ranked by:", "By quantity or by amount?"]

  - name: TRAP - the sales report still reaches the sales report
    cold: true
    turns:
      - text: "sales report for hanlim"
        expect:
          branch_kind: business_query
          reply_contains: ["Sales orders:"]
          reply_not_contains: ["Ranked by:"]
