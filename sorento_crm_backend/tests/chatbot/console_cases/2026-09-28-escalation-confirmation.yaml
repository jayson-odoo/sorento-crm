    ideation: null
    access_levels: []
    contains_flyer: false
  text: ok escalate
  expect:
    parser:
      escalation:
        is_escalation_confirmation: true
- name: '#1323 boleh, escalate over the open warehouse offer confirms the handover'
  live_only: true
  previous_conversation_state:
    focus:
      domains:
      - inventory
    open_question:
      kind: team_pick
      expects: yes_no
      team: warehouse
