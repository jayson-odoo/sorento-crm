# Console cases for chatbot memory S4, the graceful fallback (PLAN-chatbot-memory-26sep.md
# section 7 and S4; UAC AC-MEM094). The owner's round 3 hand test first, then plan 7.3
# examples 1, 3, 4 and 10.
#
# Every turn carries its own `parser:` block, so the file runs with `--mock-parser` on a
# stack with no LLM key. On the Mini, run it WITHOUT `--mock-parser` against the version
# `mem_0003_parser_history` published (pin it with `--prompt-version <id>` until promoted):
#
#   venv/bin/python scripts/chatbot_console_check.py \
#       tests/chatbot/console_cases/2026-09-memory.yaml --base-url http://127.0.0.1:8000
#
# Prerequisites: contact 900000008 has its own memory level Full memory (contact page >
# Chatbot) and a Console-ingress turn on record (the check borrows its envelope, so its
# turns are console turns and write console conversations, D14's console exception).
