  # Owner turns 2d903c96 -> 17d38019 (8 Sep): after a stock answer that ends in an escalate
  # offer, "delivery to hanlim" came back `request_for_help` with both hints null and only
  # the customer entity, the lane went out_of_scope, and the next turn was read as a YES to
  # the offer. A delivery word beside a customer name is an order ask, whatever the model
  # stamps: `output_exchange` retypes it off the switch-word table, and the parser prompt
  # now says so in the request_for_help definition itself.
  #   SELECT c.customer_name, co.name, count(o.id) FROM customers c JOIN companies co ON
  #     co.id = c.company_id LEFT JOIN orders o ON o.customer_id = c.id
  #     WHERE c.customer_name ILIKE '%hanlim%' GROUP BY 1,2 ORDER BY 3 DESC;
