  # D10 (owner console pass, 8 Sep 2026, turn 69d9900e). `SRTWC8610-SH` is a product SET
  # code (`product_sets.set_code`); no product of that code exists. The gate marks a token
  # whose only match is an incompatible type (`gate_debug.incompatible_only`) so the miss
  # lane treats it as unresolved rather than as a flat refusal (item 1); `output_exchange`
  # retypes a shipment/order-hinted product-shaped code to `product` under `incoming` so
  # the parser's own mistake does not compound it (item 2); and (D10b)
  # `entity_resolver.py`'s trigram "did-you-mean" search now runs for a token whose only
  # match is a type the caller did not ask for (the `caller_types` check beside the
  # existing `if tr.matches: continue`), which is what actually surfaces SRTWC8611 /
  # SRTWC8613 / SRTWC8614 - the set's own two member products (SRTWCX8610-SH,
  # SRTWCY8610-SH) are excluded from that list, they are part of what the customer
  # already named, not an alternative to it.
  - name: D10 - a product-set-only code on an incoming ask offers its real siblings
    text: "srtwc8610-sh hav incoming?"
    cold: true
    expect:
      branch_kind: business_query
      reply_contains: ["srtwc8610-sh", "Did you mean", "SRTWC8611", "SRTWC8613", "SRTWC8614"]
      no_uuid: true

  # D10c (owner console pass, 8 Sep 2026, turn 72146a1e). AND mode, two tokens: the
  # product token resolves ONLY to `product_set` and the attachment_type token resolves
  # fine ("certificate" -> Certification) - so the blanket incompatible-types branch never
  # fires (`compatible_entities` is non-empty, it just lacks a `product`) and the turn
  # used to fetch certificates scoped to nothing about the product, answering "no
  # certificate matched these" for a subject silently dropped from the reply. B1 (the
  # attachment-subject-gate in gate.py) now also treats an `incompatible_only` product
  # token as a missed subject, so this reaches the SAME did-you-mean as the incoming turn,
  # annotated against the certificate ask.
  - name: D10c - a product-set collision beside a resolved attachment type still gets its DYM
    # Owner call, 8 Sep 2026: parse variance on this turn, not a code defect. The gate is
    # proven on the EXACT captured payload of turn c91db3bf-6fb9-48f2-b004-4c134687f788 -
    # feeding it straight into `run_gate` returns `gate_passed=False` with
    # `gate_debug.incompatible_only == {"srtwc8610-sh": ["product_set"]}`, exactly the
    # mechanism this case grades - so a cold graded run occasionally parsing this same
    # phrase differently (missing the "no certificate" annotation) is the model, not this
    # lane. Remove the moment two consecutive graded runs pass it.
    expected_red_until: "parse variance on the certificate turn (gate proven on the captured payload, turn c91db3bf-6fb9-48f2-b004-4c134687f788)"
    text: "srtwc8610-sh certificate"
    cold: true
    expect:
      branch_kind: business_query
      reply_contains: ["srtwc8610-sh", "Did you mean", "SRTWC8611", "SRTWC8613", "SRTWC8614", "no certificate"]
      no_uuid: true
