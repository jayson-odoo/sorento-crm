          date_filter_start: null
          date_filter_end: null
          match_mode: null
          demand_qty: null
          entities: []
          entity_op: null
          domain_in_message: false
          requested_attributes: []
          contains_flyer: false
          reference_positions: []
          reference_target: null
          person_mention: null
          is_active: null
          order_status: null
          group_by: null
          top_n: null
          sales_channel: null
          correction: false
          routing: {suggested_team: null, suggested_agent: null}
          escalation: {is_escalation_confirmation: null, company_pick: null}
          document: null
          status: null
          asks: []
          topic_reset: false
          anaphora: {backward_reference: false}
        expect:
          branch_kind: ideate
          reply_not_contains:
            - "How can I help today"
