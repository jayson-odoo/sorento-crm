# Console case for PR #1279 round 2: the owner's console test of 26 Sep 2026 14:09Z
# (`documentation/plans/ideation/PLAN-ideation-chat-reply-format.md`, AC-9 to AC-12).
#
# Proves, on the owner's own session: no reply shows the opening message's preamble or
# typo in any field on any turn (W1), the typed "the manufactuirng?" never shows as the
# department (W2), and once the four fields are filled the bot shows the recap and asks
# "Submit this idea? ..." - the department answer and its "?" follow-up do NOT create the
# idea; only the final "ok" does (W3).
#
# NOT collected by pytest. Run against a lane stack (ideation configured, the shared
# service reachable, the `ideation_confirm_prompts` migration applied):
#
#   cd sorento_crm_backend
#   venv/bin/python scripts/chatbot_console_check.py \
#       tests/chatbot/console_cases/2026-09-26-ideation-confirm-before-create.yaml \
#       --base-url http://127.0.0.1:<lane backend port> --mock-parser
#
# `--mock-parser` pins the routing only; the ideation extractor and the reply composer
# still call the live LLM, so this is the live check of the prompt versions. The media
# menu turn of the original session is left out: whether a menu appears depends on the
# contact's recent WhatsApp media, not on this change.

