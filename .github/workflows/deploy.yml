name: Build and Deploy Sorento

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Build and deploy all services (ignore path filters)"
        required: false
        default: false
        type: boolean

env:
  IMAGE_REPO: jayson1004/sorento-crm
  RELEASE_TAG: 1.0.1

jobs:
  validate-backend:
    name: Validate backend imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate before any build: build-push-action pulls base images from
      # Docker Hub, and anonymous pulls share the runner's IP rate-limit, which
      # surfaces as "registry-1.docker.io ... context deadline exceeded".
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_backend
          platforms: linux/amd64
          push: false
          load: true
          tags: sorento-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke import app.main
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -c "from app.main import app; print('import ok')"

      # The worker entrypoint imports modules in a DIFFERENT order than app.main
      # (worker.py -> queue_service, then task_scheduler). A circular import can
      # pass the app.main smoke above yet kill APScheduler in the worker container
      # (seen 2026-06: email_outbox rows stuck pending because user_service <->
      # integration_service cycle only fired on the worker's import order).
      # Must be a fresh interpreter replicating worker.py's exact sequence.
      - name: Smoke import worker entrypoint (scheduler import chain)
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -c "import worker; from app.scheduler.task_scheduler import start_scheduler; print('worker import chain ok')"

      - name: Pytest collect-only (catches import errors in tests)
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -m pytest --collect-only -q

      # Fast in-image smoke gate. The real backend suite runs in `test-backend`
      # against Postgres + Redis; this keeps a couple of seconds of signal inside
      # the built image itself, which is what actually ships.
      #
      # Everything named here must run WITHOUT Postgres/Redis (pure functions or
      # SQL-compilation assertions).
      - name: Pytest regression guards (executing gate)
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -m pytest -q -p no:cacheprovider \
              tests/test_lessons_learnt_regressions.py

  validate-mcp:
    name: Validate MCP imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See validate-backend: authenticate so base-image pulls aren't anonymous
      # (avoids Docker Hub rate-limit timeouts on shared runner IPs).
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_mcp
          platforms: linux/amd64
          push: false
          load: true
          tags: sorento-mcp:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      - name: Smoke import sorento_crm_mcp
        run: |
          docker run --rm \
            -e CRM_BASE_URL=http://localhost:8000 \
            -e EXTERNAL_API_KEY=ci-dummy \
            sorento-mcp:ci \
            python -c "import sorento_crm_mcp; print('import ok')"

      # The image above is cache-hit almost every run, so it can keep passing on a
      # months-old dependency resolution while the (uncached) deploy build picks up
      # a brand-new release. That is exactly how mcp 2.0.0 - which removed
      # `mcp.server.fastmcp` - reached the server: validation green, container
      # crashlooping. Resolve dependencies from scratch and import the module the
      # entrypoint actually needs, so a breaking release fails HERE.
      - name: Build MCP image with fresh dependency resolution (no cache)
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_mcp
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: sorento-mcp:ci-nocache

      - name: Smoke the real entrypoint imports (fresh resolution)
        run: |
          docker run --rm \
            -e CRM_BASE_URL=http://localhost:8000 \
            -e EXTERNAL_API_KEY=ci-dummy \
            sorento-mcp:ci-nocache \
            python -c "
          from importlib.metadata import version
          from sorento_crm_mcp.server import create_mcp_app
          print('mcp', version('mcp'), 'entrypoint imports ok')
          "

      # Full MCP suite as an executing gate. Unlike the backend and frontend
      # suites this one is green (131 passed) and deterministic, so gating on all
      # of it is safe. Tests are mounted because the runtime image ships only the
      # package; pytest is installed at run time from the `dev` extra (a few
      # seconds — cheaper than a second image build).
      - name: Run MCP test suite (executing gate)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/sorento_crm_mcp/tests:/app/tests:ro \
            -e CRM_BASE_URL=http://localhost:8000 \
            -e EXTERNAL_API_KEY=ci-dummy \
            sorento-mcp:ci \
            sh -c "pip install --no-cache-dir -q 'pytest>=8.0' 'pytest-asyncio>=0.24' && \
                   python -m pytest /app/tests -q -p no:cacheprovider"

  test-backend:
    name: Backend test suite (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image, not plain postgres: the embedding tables need the
        # `vector` extension, which bootstrap_env creates.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sorento
          POSTGRES_PASSWORD: sorento
          POSTGRES_DB: sorento_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sorento:sorento@localhost:5432/sorento_ci
      DIRECT_URL: postgresql://sorento:sorento@localhost:5432/sorento_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-dummy-secret
      JWT_ALGORITHM: HS256
      # This job starts no frontend, so the Dealer Kit PDF render tests cannot
      # run here - and since an absent frontend is now a FAILURE rather than a
      # silent skip, the opt-out has to be stated. It is stated HERE, in the job
      # that declines them, rather than in tests/ci_excluded.txt, because they
      # are NOT excluded from CI: `test-dealer-kit-render` runs every one of
      # them against a real browser and a real frontend.
      DEALER_KIT_RENDER_TESTS: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sorento_crm_backend/requirements.txt

      - name: Install dependencies
        working-directory: sorento_crm_backend
        run: pip install -r requirements.txt

      # `alembic upgrade head` CANNOT build this schema from zero — its first
      # revision alters a table no migration creates (see bootstrap_env.py).
      # bootstrap_env creates the schema from the ORM models, adds the scm views,
      # seeds reference data (roles / order statuses / permissions), then stamps
      # alembic at head.
      - name: Bootstrap the database
        working-directory: sorento_crm_backend
        run: python -m scripts.bootstrap_env

      # Everything except tests/ci_excluded.txt — see that file for why each entry
      # is out (they assert against business data a fresh database has no reason
      # to contain). ~1960 tests, verified deterministic over 13 consecutive runs.
      - name: Run backend suite (executing gate)
        working-directory: sorento_crm_backend
        run: |
          IGNORES=$(grep -vE '^\s*#|^\s*$' tests/ci_excluded.txt | sed 's|^|--ignore=|' | tr '\n' ' ')
          echo "excluding $(echo "$IGNORES" | wc -w) path(s)"
          python -m pytest -q -p no:cacheprovider $IGNORES tests/

  # Why a SEPARATE job rather than extra steps on `test-backend`.
  #
  # This one needs everything that job needs (Postgres, pip install,
  # bootstrap_env) PLUS Node, a full `next build`, `npm start` and Playwright's
  # Chromium with its system libraries. Bolting that on would add several
  # minutes to the job every other job waits behind, for a suite of seven tests
  # that share nothing with the other ~1960.
  #
  # Split, the duplicated bootstrap is paid in PARALLEL, so the gate's wall
  # clock is the max of the two rather than the sum, and the render requirement
  # gets its own named check that reads on its own: "Dealer Kit PDF render"
  # red means the PDF stopped matching the brochure, not that some unrelated
  # service test regressed. The cost is honest and bounded: one more Postgres
  # boot and one more pip install.
  test-dealer-kit-render:
    name: Dealer Kit PDF render (real browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pgvector image as `test-backend`: bootstrap_env creates the
        # `vector` extension and will not build the schema without it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sorento
          POSTGRES_PASSWORD: sorento
          POSTGRES_DB: sorento_render_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sorento:sorento@localhost:5432/sorento_render_ci
      DIRECT_URL: postgresql://sorento:sorento@localhost:5432/sorento_render_ci
      REDIS_URL: redis://localhost:6379/0
      # ONE secret for both processes on purpose. The print URL carries an HMAC
      # over the download id signed with JWT_SECRET: pytest mints it, the API
      # verifies it. Two values here would 404 every render payload.
      JWT_SECRET: ci-dummy-secret
      JWT_ALGORITHM: HS256
      # The print page fetches the API from the BROWSER, cross-origin
      # (:3000 -> :8000), so the frontend's origin has to be allowed or every
      # render comes back as an unready page and times out.
      CORS_ORIGINS: http://localhost:3000
      # Where the render tests point Chromium.
      DEALER_KIT_PRINT_BASE_URL: http://localhost:3000
      # Baked into the frontend bundle at build time (NEXT_PUBLIC_*), which is
      # why the build must come after this is set and cannot be changed later.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sorento_crm_backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the frontend Dockerfile base (node:20-alpine).
          node-version: 20
          cache: npm
          cache-dependency-path: sorento_crm_frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: sorento_crm_backend
        run: pip install -r requirements.txt

      # The browser binary is NOT pip-installable. `--with-deps` also pulls the
      # shared libraries headless Chromium needs on a bare ubuntu runner; without
      # them the launch fails with a missing-.so error that reads like a
      # Playwright bug.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # See test-backend: `alembic upgrade head` cannot build this schema from
      # zero. bootstrap_env creates it from the ORM models and stamps alembic.
      - name: Bootstrap the database
        working-directory: sorento_crm_backend
        run: python -m scripts.bootstrap_env

      # `--force` mirrors local install: React 19 peer-dep conflicts are expected
      # and documented in CLAUDE.md.
      - name: Install frontend dependencies
        working-directory: sorento_crm_frontend
        run: npm ci --force

      # A production build, not `next dev`. The print route is a client
      # component under `app/(public)` with no auth of its own, so this needs
      # NEITHER NEXTAUTH_SECRET NOR NEXTAUTH_URL: the only variable that has to
      # be right is NEXT_PUBLIC_API_URL, and it is only readable if it is
      # present HERE, at build time.
      - name: Build the frontend
        working-directory: sorento_crm_frontend
        run: npm run build

      # Both servers are started detached with their logs on disk, so a render
      # that fails leaves something to read. Backend first: the frontend's print
      # page is useless without it.
      - name: Start the backend
        working-directory: sorento_crm_backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/health; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"; cat "$RUNNER_TEMP/backend.log"; exit 1

      # `next start` prints a warning because next.config.mjs sets
      # `output: standalone` (which is for the Docker image, where the deployed
      # entrypoint is .next/standalone/server.js). It is only a warning: the
      # build in .next is served correctly, verified locally by rendering PDFs
      # through it. Using the standalone server here would mean copying static
      # assets around by hand for no gain.
      - name: Start the frontend
        working-directory: sorento_crm_frontend
        run: |
          nohup npx next start --port 3000 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "frontend up"; exit 0
            fi
            sleep 2
          done
          echo "frontend never became healthy"; cat "$RUNNER_TEMP/frontend.log"; exit 1

      # No opt-out set, so an unreachable frontend fails here with instructions
      # rather than skipping. The junit report is written so the next step can
      # check they RAN, which a green exit code alone does not prove.
      - name: Run the PDF render suite (executing gate)
        working-directory: sorento_crm_backend
        run: |
          python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/render-junit.xml" \
            tests/test_dealer_kit_pdf_render.py

      # A suite that skipped itself exits 0. That is the exact failure this
      # whole job exists to make impossible, so it is asserted rather than
      # assumed: some tests ran, and none of them opted out.
      - name: Assert the render tests actually ran
        if: always()
        run: |
          python - "$RUNNER_TEMP/render-junit.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              sys.exit(f"no junit report at {path} ({exc}): the render tests did not run")

          suites = root.findall("testsuite") or [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          if total == 0:
              sys.exit("the render suite collected nothing")
          if skipped:
              sys.exit(
                  f"{skipped} of {total} render tests skipped. These are the only "
                  "tests that prove the exported PDF matches the brochure, so a "
                  "skip here is a green tick standing for nothing."
              )
          print(f"{total} render tests ran, none skipped")
          PY

      - name: Stop the servers
        if: always()
        run: |
          for name in frontend backend; do
            pid_file="$RUNNER_TEMP/$name.pid"
            [ -f "$pid_file" ] && kill "$(cat "$pid_file")" 2>/dev/null || true
          done

      # Only on failure, and only the tail: a render that timed out usually says
      # why in one of these two.
      - name: Server logs (on failure)
        if: failure()
        run: |
          echo "--- backend ---"; tail -n 100 "$RUNNER_TEMP/backend.log" || true
          echo "--- frontend ---"; tail -n 100 "$RUNNER_TEMP/frontend.log" || true

  validate-frontend:
    name: Validate frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the frontend Dockerfile base (node:20-alpine).
          node-version: 20
          cache: npm
          cache-dependency-path: sorento_crm_frontend/package-lock.json

      # `--force` mirrors local install: React 19 peer-dep conflicts are expected
      # and documented in CLAUDE.md.
      - name: Install dependencies
        working-directory: sorento_crm_frontend
        run: npm ci --force

      # The FULL vitest suite (198 files / 1168 tests) — green and verified
      # deterministic across repeated runs, so gating on all of it is safe.
      # Needs no database or service containers; api-client calls are mocked.
      - name: Run vitest suite (executing gate)
        working-directory: sorento_crm_frontend
        run: npx vitest run

  build-and-deploy:
    needs:
      [
        validate-backend,
        validate-mcp,
        validate-frontend,
        test-backend,
        test-dealer-kit-render,
      ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One deploy at a time, because there is ONE server and blue/green picks its
    # target color by reading which color is live. Two runs that read that at the
    # same moment both pick the same new color, both `docker compose up` it, and
    # the loser sits on a container id the winner has already recreated - so its
    # `docker inspect` never reports healthy and it dies on "not healthy after
    # 240s" while the app is perfectly fine. That is exactly what three merges
    # inside two minutes did on 2026-08-16 (runs 31925202875 / 31925216893 took
    # blue then green; 31925234662 also took green and failed).
    #
    # Not cancel-in-progress: killing a deploy mid-swap can leave nginx pointing
    # at a color nobody finished bringing up. Queued runs execute in order, so
    # the newest commit is still the one that lands last.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deploy targets
        id: targets
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "mcp=true" >> "$GITHUB_OUTPUT"
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.targets.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        if: steps.targets.outputs.should_deploy == 'true' && steps.targets.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_frontend
          platforms: linux/amd64
          push: true
          # NEXT_PUBLIC_* must be baked at build time. Set the
          # NEXT_PUBLIC_VAPID_PUBLIC_KEY repo secret to enable PWA web push in
          # prod (empty = installable but no push subscription).
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          tags: |
            ${{ env.IMAGE_REPO }}:frontend-${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_REPO }}:frontend-${{ github.sha }}

      - name: Build and Push Backend
        if: steps.targets.outputs.should_deploy == 'true' && steps.targets.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:backend-${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_REPO }}:backend-${{ github.sha }}

      - name: Build and Push MCP
        if: steps.targets.outputs.should_deploy == 'true' && steps.targets.outputs.mcp == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_mcp
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:mcp-${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_REPO }}:mcp-${{ github.sha }}

      - name: Sync deploy script to server
        if: steps.targets.outputs.should_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 1m
          # Server has no git repo. CI is the source of truth for the deploy
          # script ONLY. docker-compose.yml is gitignored (carries secret
          # defaults) so it never exists in CI checkouts — prod compose at
          # /opt/sorento-crm2/docker-compose.yml is edited manually on the
          # server. Keep the local root copy and prod in sync by hand.
          source: "scripts/blue_green_deploy.sh"
          target: "/opt/sorento-crm2"
          overwrite: true
          strip_components: 0

      - name: Deploy to Server (blue/green)
        if: steps.targets.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          command_timeout: 30m
          script: |
            set -e
            cd /opt/sorento-crm2
            chmod +x ./scripts/blue_green_deploy.sh
            IMAGE_TAG="${{ github.sha }}" ./scripts/blue_green_deploy.sh

      - name: Verify public endpoints
        if: steps.targets.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 1m
          command_timeout: 2m
          script: |
            set -e
            # Frontend / backend via host nginx (public domain)
            curl -fsS -o /dev/null https://fe-sorento.foundryx.my/ \
              || curl -fsS -o /dev/null http://127.0.0.1/
            # MCP via host nginx (n8n entrypoint, port stays 8765 forever)
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/mcp || true)
            # 406 expected for plain GET (MCP demands SSE Accept header); means nginx reached MCP.
            case "$code" in
              200|405|406) echo "MCP reachable via nginx (HTTP $code)";;
              *) echo "ERROR: MCP via nginx returned $code"; exit 1;;
            esac

  notify-owner:
    name: Notify owner by email
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check SMTP configuration
        id: smtp
        # secrets are not available in `if` expressions; resolve via env and expose a boolean output.
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$OWNER_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute notification content
        id: notify
        run: |
          RESULT="${{ needs.build-and-deploy.result }}"
          if [ "$RESULT" = "success" ]; then
            echo "subject=✅ Sorento deploy succeeded (${GITHUB_REF_NAME})" >> "$GITHUB_OUTPUT"
            echo "status_text=SUCCEEDED" >> "$GITHUB_OUTPUT"
          else
            echo "subject=❌ Sorento deploy failed (${GITHUB_REF_NAME})" >> "$GITHUB_OUTPUT"
            echo "status_text=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Send deployment email
        if: steps.smtp.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.notify.outputs.subject }}
          to: ${{ secrets.OWNER_EMAIL }}
          from: Sorento Deploy Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Warn when email secrets are missing
        if: steps.smtp.outputs.configured != 'true'
        run: |
          echo "Email notification skipped: set SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, OWNER_EMAIL secrets."

