name: Build and Deploy Sorento

on:
  push:
    branches:
      - main

env:
  IMAGE_REPO: jayson1004/sorento-crm
  RELEASE_TAG: 1.0.1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # FRONTEND IMAGE
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:frontend-${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_REPO }}:frontend-${{ github.sha }}

      # BACKEND IMAGE
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:backend-${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_REPO }}:backend-${{ github.sha }}

      # MCP IMAGE
      - name: Build and Push MCP
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_mcp
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:mcp-${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_REPO }}:mcp-${{ github.sha }}

      # DEPLOY USING DOCKER COMPOSE
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          command_timeout: 30m
          script: |
            cd /opt/sorento-crm2

            # pull latest git code if compose file is in repo
            git pull || true

            # pull latest images used by docker-compose.yml
            docker pull ${{ env.IMAGE_REPO }}:frontend-${{ env.RELEASE_TAG }}
            docker pull ${{ env.IMAGE_REPO }}:backend-${{ env.RELEASE_TAG }}
            docker pull ${{ env.IMAGE_REPO }}:mcp-${{ env.RELEASE_TAG }}

            # recreate/update containers with latest images
            docker compose up -d --remove-orphans

            docker system prune -f
