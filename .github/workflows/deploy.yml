name: Build and Deploy Sorento

on:
  # A push to main runs ONLY the alembic fast gate (`check-migration-heads`,
  # about 20 seconds): no test suite, no image build, no deploy. Owner
  # decision 2026-09-29 23:05: "control the running of main branch CI so not
  # every merge will trigger the CI automatically", and a live deploy waits
  # for the owner's approval. A release is the `workflow_dispatch` below.
  push:
    branches:
      - main
  # `types: [labeled]` ONLY - a push to the PR branch fires no `pull_request`
  # event at all (GitHub still fires `labeled` again on the PR's CURRENT head
  # every time any label is added, so the orchestrator re-adds `ci` to re-run
  # against a new head). Every root job below then gates on
  # `github.event.label.name == 'ci'`, so labeling with anything else is a
  # no-op. This exists because push-triggered PR runs were burning most of the
  # account's 20 concurrent job slots and queuing push-to-main deploys behind
  # them for 30-50+ minutes (2026-09-25: runs 36103575754/36105804527/36107711150
  # all queued behind one PR run). A PR with no `ci` label therefore shows NO
  # checks. Whether that blocks the merge is the ruleset's call, not this
  # file's: as of 2026-09-29 the `protect-main-branch` ruleset requires no
  # status checks and has no merge-queue rule, so an unlabelled PR can still
  # be merged by hand. The required-check names and the merge-queue settings
  # that make the label the real gate are listed in
  # documentation/plans/ci/PLAN-ci-fast-gate-29sep.md for the owner to apply.
  pull_request:
    branches:
      - main
    types: [labeled]
  # Merge-queue entries: GitHub creates a temporary branch containing the
  # candidate merge result (this PR merged onto main plus every entry queued
  # ahead of it) and fires this event. This is where the FULL suite runs: a
  # `ci`-labelled PR run is the fast gate only (alembic head, image imports,
  # typecheck, vitest, and the SCM shards when SCM paths changed), while the
  # six main backend shards run here and nowhere else before main. The queue
  # therefore also catches two individually-green branches that only break
  # combined (duplicate alembic heads, a shared count assertion off by one).
  # Until the ruleset carries a merge-queue rule, PRs merge directly and
  # nothing but the alembic gate runs on the resulting push to main.
  merge_group:
  # THE RELEASE. Run on main by the orchestrator after the owner has merged a
  # batch:
  #   gh workflow run deploy.yml --repo jayson-odoo/sorento-crm --ref main
  #   gh workflow run deploy.yml --repo jayson-odoo/sorento-crm --ref main -f skip_tests=true
  # It runs the full suite on main's head (unless skip_tests), then
  # build-images, then build-and-deploy, which carries `environment:
  # production` and therefore PAUSES until the owner approves the deployment
  # in GitHub (environment "production", required reviewer jayson-odoo,
  # deployment branches: main only). On any other ref a dispatch runs the
  # suite only: build-images and build-and-deploy also require main.
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test suite and go straight to build + deploy (main's head was already validated, e.g. by a green merge-queue run)"
        required: false
        default: false
        type: boolean

# Cancels a PR's own superseded `ci` runs without touching anything else,
# which is why the group key and cancel-in-progress both differ by event and
# label instead of being one flat rule:
#   - pull_request labeled `ci`: the group key is the PR number, so every
#     `ci` run for the same PR lands in the same group, and cancel-in-progress
#     is true, so GitHub cancels that PR's older queued/running `ci` run per
#     the docs' per-group cancellation semantics
#     (https://docs.github.com/actions/using-jobs/using-concurrency). Re-adding
#     `ci` against a new head therefore supersedes the run on the old head.
#   - pull_request labeled ANYTHING ELSE (needs-hand-test, lane-running,
#     needs-decision, ...): the trigger fires for every label, and every job
#     below skips on the label name, but the run still exists and still joins
#     a concurrency group. When that group was the PR number, adding an
#     orchestration label cancelled the PR's live `ci` run (2026-09-28, #1304,
#     run 36387225667). So a non-`ci` label event falls through to
#     github.run_id: a unique group that collides with nothing, and
#     cancel-in-progress is false for it besides. It finishes in seconds with
#     every job skipped and cancels nothing.
#   - push (to main), merge_group and workflow_dispatch:
#     github.event.pull_request.number is empty, so the group key is
#     github.run_id here too, unique to this run, and cancel-in-progress is
#     false, so two releases dispatched close together both run. The
#     dedicated `deploy-production` job-level group below is untouched
#     (cancel-in-progress false) so the second release's deploy queues
#     behind the first instead of overlapping it.
# The expression is `a && b && c || d`, GitHub's ternary idiom: the PR number
# when this is a `ci` label event (a truthy number), else the run id. Both
# lines are evaluated as written by
# sorento_crm_backend/tests/test_ci_docs_only_filter.py (test_concurrency_*),
# with the real context values of each event, so the rule cannot regress
# silently.
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.label.name == 'ci' && github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.label.name == 'ci' }}

env:
  IMAGE_REPO: jayson1004/sorento-crm
  RELEASE_TAG: 1.0.1

jobs:
  # Fast pre-check: fail in under a minute when the alembic migration graph
  # has more than one head, instead of consuming a 21-35 minute full-CI cycle
  # (or a merge-queue slot) to discover the same thing. Two branches each
  # merge main and add their own NNN_merge_* revision; each is green alone,
  # and the second to land gives main two heads, at which point
  # `alembic upgrade head` refuses and every database-touching job dies at
  # bootstrap. This job parses the version files with the stdlib only (no pip
  # install: alembic's env.py imports the whole app), builds the
  # revision/down_revision graph, and fails unless exactly one head remains.
  check-migration-heads:
    name: Single alembic head (fast gate)
    runs-on: ubuntu-latest
    # Root job (no `needs`): gates the whole `pull_request` run on the `ci`
    # label. `github.event_name != 'pull_request'` keeps push/merge_group/
    # workflow_dispatch running exactly as before; on a `pull_request` event
    # (now `labeled` only) this only passes when the label just added is `ci`,
    # so labeling with anything else no-ops. No status-check function
    # (success()/always()/etc) appears in this expression, so every job that
    # `needs` this one (directly or transitively) is skipped automatically
    # when it is skipped - see https://docs.github.com/actions/using-jobs/using-conditions-to-control-job-execution.
    # The job NAME is what a ruleset's required-status-check list matches; a
    # PR with no `ci` label simply never reports this check. That only blocks
    # the merge once the ruleset requires it (it does not as of 2026-09-29,
    # see the trigger comment above and PLAN-ci-fast-gate-29sep.md).
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On a push to main this job is the whole run (see the `push` trigger
      # comment): a fork of the migration graph is reported within a minute
      # of the merge that caused it, and nothing else runs until a release.
      - name: Assert exactly one migration head
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys

          versions = pathlib.Path("sorento_crm_backend/alembic/versions")
          revs, downs = set(), set()
          for f in sorted(versions.glob("*.py")):
              # encoding is explicit: ten migrations hold non-ASCII literals
              # (151, 154, 155, 258, 259, 260, 305, 306, 307, 311m), and a bare
              # read_text() decodes with the runner's locale, which is ASCII
              # whenever LANG is unset. The gate then dies on a
              # UnicodeDecodeError instead of reporting the head count.
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in tree.body:
                  if isinstance(node, ast.Assign) and len(node.targets) == 1 \
                          and isinstance(node.targets[0], ast.Name):
                      name, value = node.targets[0].id, node.value
                  elif isinstance(node, ast.AnnAssign) \
                          and isinstance(node.target, ast.Name) and node.value is not None:
                      name, value = node.target.id, node.value
                  else:
                      continue
                  if name not in ("revision", "down_revision"):
                      continue
                  val = ast.literal_eval(value)
                  if name == "revision":
                      revs.add(val)
                  elif val is not None:
                      downs.update([val] if isinstance(val, str) else val)
          heads = sorted(revs - downs)
          print(f"{len(revs)} revisions, {len(heads)} head(s): {heads}")
          if len(heads) != 1:
              sys.exit(
                  "the migration graph must have exactly one head: merge main "
                  "and add a merge revision joining these heads"
              )
          PY

  # Which areas a change touches, so the multi-minute jobs below only run
  # when the code they test can have changed. Before this, every job ran on
  # every PR regardless of what it changed, which is the main reason CI
  # minutes kept growing on a metered plan.
  #
  # Two questions, answered from one file list:
  #
  # 1. `docs_only`: is EVERY changed file documentation? Docs-only means
  #    every path matches `DOCS_RE` below (`documentation/**`, `.claude/**`,
  #    `.cursor/**`, a root-level `*.md` such as CLAUDE.md, PRINCIPLES.md or
  #    LESSONS-LEARNT.md, or the PR template) AND no path matches
  #    `NOT_DOCS_RE`: the parts of documentation/ that tests READ as live
  #    inputs (`documentation/reference/*.md`, `plans/<domain>/fixtures/`,
  #    `plans/<domain>/samples/`, `plans/<domain>/seed-assets/`, and two
  #    plan files whose text a test asserts against). A change there can
  #    turn a test red, so it keeps the full pipeline. Nothing under the
  #    four service trees counts either, whatever its extension: `*.md`
  #    files inside them are test fixtures (tests/chatbot/replay_turns,
  #    e2e/fixtures) and the MCP Dockerfile copies its README into the
  #    image. A workflow, a Dockerfile, a migration, a lockfile or any
  #    config file is therefore never docs-only, because none of them
  #    match. A rename counts both of its paths (`previous_filename` is in
  #    the jq filters), so a file moved between a service tree and
  #    documentation/ is never docs-only in either direction. When the
  #    answer is yes, every area flag is false, so the validate/test/
  #    typecheck jobs skip through their existing `if`s: a docs-only PR run
  #    or queue entry is this job and the alembic gate above (about 30
  #    seconds between them) and nothing else. Owner ruling 29 Sep 2026:
  #    "all the docs merge don't need to trigger deployment"; on the Free
  #    plan a docs-only change was taking the same full test cycle as a code
  #    change and queuing behind it. A release (workflow_dispatch) is never
  #    docs-only: it has no diff, it tests and ships main's head.
  #
  #    Fail-safe direction is always the full pipeline: an empty file list,
  #    a compare call that fails, a branch-creation push (zero `before`
  #    SHA), a manual dispatch, or a list that hits the compare API's
  #    300-file cap (so it may be truncated) all report docs_only=false.
  #
  # 2. `backend` / `frontend` / `mcp` / `scm`: which service trees a PULL
  #    REQUEST touches. `scm` is the slice of the backend whose change makes
  #    the three SCM shards run on a PR (`SCM_RE`: the scm API, service,
  #    module and model files, `tests/scm/`, an scm migration, and the
  #    test-harness files every backend test depends on); the six main
  #    backend shards never run on a PR (see `test-backend`). A merge-queue
  #    entry that is not docs-only, and a release (workflow_dispatch, which
  #    has no diff to filter: it tests main's head as a whole), report every
  #    area as changed, so the queue and the release gate on the full set.
  #    The alembic gate above is deliberately NOT behind this: it is the fast
  #    check, and it must run on every PR. The workflow file itself counts as
  #    every area, or a change to it could never be exercised by the PR that
  #    makes it.
  #
  # 3. `skip_tests` (release input): the orchestrator dispatching a release
  #    can declare main's head already validated (a green merge-queue run on
  #    that very commit, say). Every area flag is then false, the 16 test
  #    jobs skip, and the run is build-images + build-and-deploy +
  #    notify-owner (about 15 job-minutes instead of ~190). It is the
  #    dispatcher's call, made per release; nothing here infers it.
  #
  # 4. `backend_tests`: the backend test FILES a PULL REQUEST changes
  #    (`BACKEND_TESTS_RE`: `sorento_crm_backend/tests/**/test_*.py`, minus
  #    `tests/scm/`, which the SCM shards already run), space-separated, for
  #    `test-backend-changed`. The six main backend shards never run on a
  #    PR (owner ruling 2026-09-29), so before this a PR that only changed
  #    `tests/test_media_job_lifecycle.py` (#1387, run 36665697605) ran the
  #    alembic gate, this job and validate-backend (collect-only plus the
  #    regression guards) and never executed the test it changed: the
  #    first execution was the merge queue or the release. Now the changed
  #    files themselves run on the PR, serially, and nothing else changes:
  #    the label gating, the area flags and the queue's full run are as
  #    before. Empty off a PR (the full shards run there) and on every
  #    early exit above. Deleted and renamed-away paths are in the list too
  #    (a PR's file list names them); the job drops what the checkout does
  #    not hold, and the ci_excluded.txt entries, before it runs pytest.
  #
  # 5. Import-based selection (CI-SPEED, owner decision 1 Oct 2026):
  #    changed test files alone missed the test that broke the 1 Oct
  #    release (tests/test_ingest_parity_security_fixes.py imports
  #    app/services/shipping_order_ingest_service.py, changed by #1411, and
  #    first ran in the release). When a PR changes backend code
  #    (`backend_code`: .py under app/, scripts/, or a non-test helper
  #    under tests/), step "Select backend tests by import" runs
  #    sorento_crm_backend/scripts/ci_select_tests.py over a sparse
  #    checkout: every test file that references a changed module, or a
  #    module that imports one (one level), joins the changed test files
  #    in `backend_tests` (tests/scm/ only when the SCM shards do not run
  #    anyway). When the selection's estimated cost (per-file sums of the
  #    committed .test_durations, a file without history at the median
  #    file) exceeds 3600 CPU-s it sets `backend_full=true` instead: the
  #    six main shards and the SCM shards then run on that PR, and
  #    `test-backend-changed` steps aside. The script prints the list.
  #    Asserted by tests/test_ci_select_tests.py (the script) and
  #    tests/test_ci_docs_only_filter.py (the step and the job gating).
  #
  # This job does not run on a push to main at all (see the `push` trigger
  # comment): nothing downstream of it does either, so there is nothing to
  # classify.
  #
  # Plain `gh api` over the file list (the PR's files, or the compare of
  # the push / merge-queue range), no third-party action, and a checkout
  # only for point 5: the classification is one HTTP call and it finishes
  # in seconds. The step is asserted by
  # sorento_crm_backend/tests/test_ci_docs_only_filter.py, which extracts
  # this step's `run` block out of this file and executes it with a stub
  # `gh` (real `jq` over a canned API payload) for docs-only, mixed, rename
  # and fail-safe cases, so the shell under test is the shell that ships.
  # The same test scans every backend and MCP test for the documentation/
  # paths it opens (pathlib chains and open()/Path() arguments, not
  # comments) and fails when one of them would classify as docs, which is
  # the signal to extend NOT_DOCS_RE below.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    # Same gate as check-migration-heads above, and for the same reason: this
    # is the other root job (no `needs`), so skipping it here skips every job
    # that depends on it transitively (validate-backend, validate-mcp,
    # test-backend, test-backend-scm, validate-frontend, typecheck-frontend,
    # build-images) without touching their own `if` conditions. `push` is
    # excluded the same way: a push to main runs the alembic gate and nothing
    # else.
    if: >-
      github.event_name != 'push'
      && (github.event_name != 'pull_request' || github.event.label.name == 'ci')
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      scm: ${{ steps.filter.outputs.scm }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      # The import-based selection when the PR changes backend code (step
      # `select`), else the changed test files alone. Ignored when
      # backend_full is true: the shards run instead.
      backend_tests: ${{ steps.select.outputs.tests || steps.filter.outputs.backend_tests }}
      backend_full: ${{ steps.select.outputs.full == 'true' }}
    steps:
      - name: Detect changed areas
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          # Release input (workflow_dispatch only; empty on every other event).
          SKIP_TESTS: ${{ inputs.skip_tests }}
          # push: the range main moved by. `before` is the zero SHA only on a
          # branch-creation push, which main never sees; guarded anyway.
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          # merge_group: the candidate merge result against the base it was
          # built on, so the queue classifies exactly the files it would land.
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          # One line per changed path, or empty with `why` set when the list
          # cannot be established (which means: full pipeline). A renamed
          # file contributes both its new path (`filename`) and its old one
          # (`previous_filename`, absent on every other status), so a move
          # out of or into a service tree is judged on both ends.
          files=""
          why=""
          compare() {
            gh api "repos/$GITHUB_REPOSITORY/compare/$1...$2" --paginate \
              --jq '.files[] | .filename, (.previous_filename // empty)'
          }
          case "$EVENT" in
            pull_request)
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
                        --jq '.[] | .filename, (.previous_filename // empty)') \
                || { files=""; why="PR file list call failed"; }
              ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                why="branch-creation push (before is the zero SHA)"
              else
                files=$(compare "$PUSH_BEFORE" "$PUSH_AFTER") \
                  || { files=""; why="compare $PUSH_BEFORE...$PUSH_AFTER failed"; }
              fi
              ;;
            merge_group)
              files=$(compare "$MG_BASE" "$MG_HEAD") \
                || { files=""; why="compare $MG_BASE...$MG_HEAD failed"; }
              ;;
            *)
              why="$EVENT never skips: every area counts as changed"
              ;;
          esac
          files=$(printf '%s\n' "$files" | sed '/^$/d' | sort -u)
          count=$(printf '%s' "$files" | grep -c . || true)
          if [ -n "$files" ]; then
            echo "changed files ($count):"; printf '%s\n' "$files" | sed 's/^/  /'
          fi

          # Docs-only classification: a path is docs when it matches DOCS_RE and
          # does not match NOT_DOCS_RE. NOT_DOCS_RE lists the documentation/
          # paths that tests read as live inputs; the pytest named in the job
          # comment fails when a test reads a documentation/ path this pair
          # would still classify as docs, so extend NOT_DOCS_RE when it does.
          DOCS_RE='^(documentation/|\.claude/|\.cursor/|[^/]+\.md$|\.github/PULL_REQUEST_TEMPLATE\.md$)'
          NOT_DOCS_RE='^documentation/(reference/|plans/(_archive/)?[^/]+/(fixtures|samples|seed-assets)/|plans/autocount/PLAN-autocount-cross-repo-contract\.md$|plans/_archive/scm/PLAN-scm-fulfilment-feedback-p4\.md$)'
          non_docs=$({
            printf '%s\n' "$files" | grep -Ev "$DOCS_RE" || true
            printf '%s\n' "$files" | grep -E "$NOT_DOCS_RE" || true
          } | sort -u)
          docs_only=false
          if [ -n "$why" ]; then
            echo "docs_only=false: $why"
          elif [ -z "$files" ]; then
            echo "docs_only=false: no changed files reported"
          elif [ "$count" -ge 300 ]; then
            echo "docs_only=false: $count files reaches the compare API's 300-file cap, list may be truncated"
          elif [ -n "$non_docs" ]; then
            echo "docs_only=false: non-docs paths present (code, or documentation a test reads as input):"
            printf '%s\n' "$non_docs" | sed 's/^/  /'
          else
            docs_only=true
            echo "docs_only=true: every changed file is documentation"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

          # `backend_tests` is written on every path out of this step, empty
          # unless a pull_request's own file list reaches the flags below:
          # off a PR the full shards run and the changed-files job must not.
          if [ "$docs_only" = "true" ]; then
            for area in backend frontend mcp scm; do echo "$area=false"; done | tee -a "$GITHUB_OUTPUT"
            printf '%s\n' "backend_tests=" "backend_code=" >> "$GITHUB_OUTPUT"
            echo "docs-only change: no service area counts as changed"
            exit 0
          fi
          # A release dispatched with skip_tests: no test job runs, only the
          # build and the deploy, which gate on the event rather than on the
          # areas.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SKIP_TESTS" = "true" ]; then
            for area in backend frontend mcp scm; do echo "$area=false"; done | tee -a "$GITHUB_OUTPUT"
            printf '%s\n' "backend_tests=" "backend_code=" >> "$GITHUB_OUTPUT"
            echo "release with skip_tests=true: no test job runs"
            exit 0
          fi
          # A PR whose file list could not be fetched is treated like a push:
          # every area changed. Before docs_only existed the failed call
          # failed this job (and skipped every gate with it, red); a swallowed
          # failure must never turn into an all-flags-false green run.
          if [ "$EVENT" != "pull_request" ] || [ -n "$why" ]; then
            for area in backend frontend mcp scm; do echo "$area=true"; done | tee -a "$GITHUB_OUTPUT"
            printf '%s\n' "backend_tests=" "backend_code=" >> "$GITHUB_OUTPUT"
            echo "${why:-$EVENT is not a pull_request}: every area counts as changed"
            exit 0
          fi
          flag() {
            if printf '%s\n' "$files" | grep -Eq "$2"; then echo "$1=true"; else echo "$1=false"; fi
          }
          # SCM_RE: what makes the SCM shards run on a PR. The scm API,
          # service, module, model and schema files, the SCM tests, an scm
          # migration, and the harness every backend test depends on
          # (conftest, the Postgres fixture, bootstrap_env, requirements, the
          # exclusion list, the durations file). A backend change outside
          # these is covered by the queue's full run, not by the PR.
          SCM_RE='^(sorento_crm_backend/(app/(api/v1/scm|services/scm|modules/scm)/|app/models/scm|app/schemas/scm_|tests/scm/|tests/conftest\.py$|tests/_pg_fixture\.py$|tests/ci_excluded\.txt$|\.test_durations$|scripts/bootstrap_env\.py$|requirements\.txt$|alembic/versions/[^/]*scm)|\.github/workflows/deploy\.yml$)'
          {
            flag backend  '^(sorento_crm_backend/|\.github/workflows/deploy\.yml$)'
            flag frontend '^(sorento_crm_frontend/|\.github/workflows/deploy\.yml$)'
            flag mcp      '^(sorento_crm_mcp/|\.github/workflows/deploy\.yml$)'
            flag scm      "$SCM_RE"
          } | tee -a "$GITHUB_OUTPUT"
          # BACKEND_TESTS_RE: the backend test files this PR changes, for
          # `test-backend-changed` (point 4 of the job comment). `test_*.py`
          # only, pytest's own collection pattern: a helper module or a
          # fixture file handed to pytest collects nothing and exits 5. Not
          # tests/scm/: the SCM shards run those whenever `scm` is true. The
          # character class is deliberate: the list becomes a pytest
          # argument line, so a path holding anything a shell would parse
          # (a space, a quote, a backtick) is simply not in it.
          BACKEND_TESTS_RE='^sorento_crm_backend/tests/([A-Za-z0-9_.-]+/)*test_[A-Za-z0-9_.-]*\.py$'
          backend_tests=$(printf '%s\n' "$files" | { grep -E "$BACKEND_TESTS_RE" || true; } \
                            | { grep -Ev '^sorento_crm_backend/tests/scm/' || true; } \
                            | tr '\n' ' ' | sed 's/ $//')
          echo "backend_tests=$backend_tests" | tee -a "$GITHUB_OUTPUT"
          # BACKEND_CODE_RE: the backend .py modules this PR changes (app/,
          # scripts/, and the non-test helpers under tests/), for the
          # import-based selection in the next step (point 5 of the job
          # comment). Same shell-safe character class as BACKEND_TESTS_RE.
          BACKEND_CODE_RE='^sorento_crm_backend/(app|scripts|tests)/([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+\.py$'
          backend_code=$(printf '%s\n' "$files" | { grep -E "$BACKEND_CODE_RE" || true; } \
                           | { grep -Ev "$BACKEND_TESTS_RE" || true; } \
                           | tr '\n' ' ' | sed 's/ $//')
          echo "backend_code=$backend_code" | tee -a "$GITHUB_OUTPUT"

      # Only on a PR that changes backend code: the selection reads the
      # backend sources, and nothing else in this job needs a checkout.
      # Sparse: app/, scripts/ and tests/ are all the script parses.
      - name: Checkout backend sources for test selection
        if: steps.filter.outputs.backend_code != ''
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sorento_crm_backend/app
            sorento_crm_backend/scripts
            sorento_crm_backend/tests

      # Point 5 of the job comment. Stdlib-only script on the runner's own
      # python3; it prints the selection, so the job log shows what runs.
      - name: Select backend tests by import
        id: select
        if: steps.filter.outputs.backend_code != ''
        env:
          BACKEND_CODE: ${{ steps.filter.outputs.backend_code }}
          BACKEND_TESTS: ${{ steps.filter.outputs.backend_tests }}
          SCM: ${{ steps.filter.outputs.scm }}
        run: |
          printf '%s\n' $BACKEND_CODE $BACKEND_TESTS \
            | python3 sorento_crm_backend/scripts/ci_select_tests.py --root sorento_crm_backend --scm "$SCM"

  validate-backend:
    name: Validate backend imports
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate before any build: build-push-action pulls base images from
      # Docker Hub, and anonymous pulls share the runner's IP rate-limit, which
      # surfaces as "registry-1.docker.io ... context deadline exceeded".
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_backend
          platforms: linux/amd64
          push: false
          load: true
          tags: sorento-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke import app.main
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -c "from app.main import app; print('import ok')"

      # The worker entrypoint imports modules in a DIFFERENT order than app.main
      # (worker.py -> queue_service, then task_scheduler). A circular import can
      # pass the app.main smoke above yet kill APScheduler in the worker container
      # (seen 2026-06: email_outbox rows stuck pending because user_service <->
      # integration_service cycle only fired on the worker's import order).
      # Must be a fresh interpreter replicating worker.py's exact sequence.
      - name: Smoke import worker entrypoint (scheduler import chain)
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -c "import worker; from app.scheduler.task_scheduler import start_scheduler; print('worker import chain ok')"

      - name: Pytest collect-only (catches import errors in tests)
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -m pytest --collect-only -q

      # Fast in-image smoke gate. The real backend suite runs in `test-backend`
      # against Postgres + Redis; this keeps a couple of seconds of signal inside
      # the built image itself, which is what actually ships.
      #
      # Everything named here must run WITHOUT Postgres/Redis (pure functions or
      # SQL-compilation assertions).
      - name: Pytest regression guards (executing gate)
        run: |
          docker run --rm --entrypoint python \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e DIRECT_URL=postgresql://x:x@localhost/x \
            -e JWT_SECRET=ci-dummy-secret \
            -e JWT_ALGORITHM=HS256 \
            -e REDIS_URL=redis://localhost:6379/0 \
            sorento-backend:ci \
            -m pytest -q -p no:cacheprovider \
              tests/test_lessons_learnt_regressions.py

  validate-mcp:
    name: Validate MCP imports
    needs: [changes]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See validate-backend: authenticate so base-image pulls aren't anonymous
      # (avoids Docker Hub rate-limit timeouts on shared runner IPs).
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_mcp
          platforms: linux/amd64
          push: false
          load: true
          tags: sorento-mcp:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      - name: Smoke import sorento_crm_mcp
        run: |
          docker run --rm \
            -e CRM_BASE_URL=http://localhost:8000 \
            -e EXTERNAL_API_KEY=ci-dummy \
            sorento-mcp:ci \
            python -c "import sorento_crm_mcp; print('import ok')"

      # The image above is cache-hit almost every run, so it can keep passing on a
      # months-old dependency resolution while the (uncached) deploy build picks up
      # a brand-new release. That is exactly how mcp 2.0.0 - which removed
      # `mcp.server.fastmcp` - reached the server: validation green, container
      # crashlooping. Resolve dependencies from scratch and import the module the
      # entrypoint actually needs, so a breaking release fails HERE.
      - name: Build MCP image with fresh dependency resolution (no cache)
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_mcp
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: sorento-mcp:ci-nocache

      - name: Smoke the real entrypoint imports (fresh resolution)
        run: |
          docker run --rm \
            -e CRM_BASE_URL=http://localhost:8000 \
            -e EXTERNAL_API_KEY=ci-dummy \
            sorento-mcp:ci-nocache \
            python -c "
          from importlib.metadata import version
          from sorento_crm_mcp.server import create_mcp_app
          print('mcp', version('mcp'), 'entrypoint imports ok')
          "

      # Full MCP suite as an executing gate. Unlike the backend and frontend
      # suites this one is green (131 passed) and deterministic, so gating on all
      # of it is safe. Tests are mounted because the runtime image ships only the
      # package; pytest is installed at run time from the `dev` extra (a few
      # seconds — cheaper than a second image build).
      - name: Run MCP test suite (executing gate)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/sorento_crm_mcp/tests:/app/tests:ro \
            -e CRM_BASE_URL=http://localhost:8000 \
            -e EXTERNAL_API_KEY=ci-dummy \
            sorento-mcp:ci \
            sh -c "pip install --no-cache-dir -q 'pytest>=8.0' 'pytest-asyncio>=0.24' && \
                   python -m pytest /app/tests -q -p no:cacheprovider"

  # Why tests/scm gets its OWN job rather than another step here.
  #
  # A job split, so two halves run in parallel instead of one long serial run.
  # tests/scm is the fastest-growing area of the suite (PR #135, commit c738b1ad,
  # added 119 test files in one merge), and run serially with everything else it
  # is simply added to the gate's wall clock. Split into two jobs the duplicated
  # Postgres boot and pip install are paid in PARALLEL, so the gate costs the MAX
  # of the two halves rather than their SUM. `test-backend` excludes tests/scm,
  # this job runs only tests/scm, and between them they cover exactly what the
  # single job did.
  #
  # `$IGNORES` is built from the same tests/ci_excluded.txt here: the entries
  # that point outside tests/scm are harmless `--ignore` paths for a run that was
  # never going to collect them, and keeping one shared expression means an
  # exclusion cannot be added to one half and forgotten in the other.
  #
  # Sharded 3-way (run 35945594213, 2026-09-24): one runner took 25:39 wall
  # clock for 3951 tests (23:53 under xdist plus 18s for the serial_ddl step),
  # and that single job was the gate's critical path. pytest-split assigns
  # every collected test to exactly one group, so the three groups together
  # are the full tests/scm suite and no test runs twice or is dropped.
  #
  # On a PR this runs only when SCM paths changed (`scm` flag, see `changes`);
  # a merge-queue entry and a release run it regardless.
  test-backend-scm:
    name: Backend test suite - SCM (Postgres, xdist)
    needs: [changes]
    if: needs.changes.outputs.scm == 'true' || needs.changes.outputs.backend_full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # pgvector image, not plain postgres: the embedding tables need the
        # `vector` extension, which bootstrap_env creates.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sorento
          POSTGRES_PASSWORD: sorento
          POSTGRES_DB: sorento_scm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sorento:sorento@localhost:5432/sorento_scm_ci
      DIRECT_URL: postgresql://sorento:sorento@localhost:5432/sorento_scm_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-dummy-secret
      JWT_ALGORITHM: HS256
      # No frontend in this job either - see the same note on `test-backend`.
      DEALER_KIT_RENDER_TESTS: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sorento_crm_backend/requirements.txt

      - name: Install dependencies
        working-directory: sorento_crm_backend
        run: pip install -r requirements.txt

      # See test-backend: `alembic upgrade head` cannot build this schema from
      # zero. bootstrap_env creates it from the ORM models and stamps alembic.
      # Throwaway database: durability costs the suite fsync on every commit for
      # nothing. All three settings are reloadable (SIGHUP context), no restart.
      - name: Relax Postgres durability for the test run
        run: |
          # One -c per statement: a multi-statement -c runs in one transaction
          # and ALTER SYSTEM refuses to run inside a transaction block.
          # $DATABASE_URL carries the job's own database name (the two backend
          # jobs use different ones), so target that rather than a literal.
          PSQL="psql $DATABASE_URL -v ON_ERROR_STOP=1"
          $PSQL -c "ALTER SYSTEM SET fsync = off" \
                -c "ALTER SYSTEM SET synchronous_commit = off" \
                -c "ALTER SYSTEM SET full_page_writes = off" \
                -c "ALTER SYSTEM SET max_locks_per_transaction = 1024" \
                -c "SELECT pg_reload_conf()"
          # max_locks_per_transaction is postmaster-level, so the service container
          # is restarted for it to take. Without it the lock table (default 64 x
          # max_connections) ran out under xdist - four workers each holding a
          # scratch schema of ~400 relations - and a test died with "out of shared
          # memory" (run 33130805987, test_media_quota_serialization). The three
          # durability settings above survive the restart: ALTER SYSTEM persists.
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U sorento && break
            sleep 1
          done
          $PSQL -c "SHOW fsync" -c "SHOW synchronous_commit" -c "SHOW full_page_writes" \
                -c "SHOW max_locks_per_transaction"

      - name: Bootstrap the database
        working-directory: sorento_crm_backend
        run: python -m scripts.bootstrap_env

      # `-m "not serial_ddl"` is the SCM half of the same rule the `test-backend`
      # job states below for tests/test_migration_*.py, and it is not an
      # optimization either.
      #
      # A handful of tests here run DDL against the REAL, SHARED `scm` relations
      # rather than a scratch schema, because that is the only way to exercise a
      # migration's own frozen `upgrade()` body: `scm` is schema-qualified in
      # that SQL, so it ignores the search_path `blank_session` pins and lands on
      # the live relation. That used to be `DROP VIEW IF EXISTS scm.committed_v
      # CASCADE` in tests/scm/test_committed_v_migration_chain.py, which held an
      # AccessExclusiveLock on `committed_v` and on every view CASCADE reaches
      # (`net_position_v` first) until the test's transaction rolled back, while
      # another worker's reorder run read those same views in the opposite
      # order - a lock cycle, and Postgres kills one side of it.
      #
      # Four hits, issue #987: PR #973 run 35150767560, PR #985 run 35176172055
      # (twice) - all three inside `reorder_run_service._planning_rows`, killed on
      # the READING side - and PR #1001 run 35292962581, killed on the DDL side in
      # tests/scm/test_committed_v_migration_chain.py. Reproduced locally at
      # `-n 4 --dist loadfile`: `committed_v` vs `net_position_v`, exactly that
      # cycle. `--dist loadfile` serializes the tests of ONE file and can do
      # nothing about two files on two workers.
      #
      # #1013 moved that file's round trips onto a scratch schema instead, so it
      # no longer carries this marker. The SCM members of the marked set today
      # are the ALTER TABLE test in test_description_translation.py and the 273
      # downgrade (a real `DROP SCHEMA scm CASCADE`) in test_m0_cp1_schema.py -
      # a few seconds of test time, so it runs in a second pass with the pool
      # drained and nothing else on the database.
      - name: Run SCM backend suite (executing gate)
        working-directory: sorento_crm_backend
        run: |
          IGNORES=$(grep -vE '^\s*#|^\s*$' tests/ci_excluded.txt | sed 's|^|--ignore=|' | tr '\n' ' ')
          echo "excluding $(echo "$IGNORES" | wc -w) path(s) plus the serial_ddl tests; shard ${{ matrix.shard }} of 3"
          python -m pytest -q -p no:cacheprovider -n auto --dist loadfile --durations=30 \
            --splits 3 --group ${{ matrix.shard }} \
            --store-durations --durations-path .test_durations \
            -m "not serial_ddl" $IGNORES tests/scm/

      # Feeds `.test_durations` (see test-backend): the checked-out committed
      # file is what `duration_based_chunks` reads to balance the 3 groups,
      # and `--store-durations` then overwrites it with that same history
      # plus fresh numbers for the tests THIS shard ran, so every shard's
      # artifact carries the full file, not just its own slice - merged by
      # hand (any shard's value for a key it did not run is unchanged from
      # the committed baseline, so any shard's copy is a safe base to
      # overwrite with the values from the shards that did run each test).
      - name: Upload SCM shard durations artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scm-durations-${{ matrix.shard }}
          path: sorento_crm_backend/.test_durations
          retention-days: 7
          # The durations file is a dotfile; upload-artifact excludes those by
          # default and silently uploads nothing ("No files were found").
          include-hidden-files: true

      - name: Run SCM serial_ddl tests serially (executing gate)
        if: matrix.shard == 1
        working-directory: sorento_crm_backend
        run: |
          IGNORES=$(grep -vE '^\s*#|^\s*$' tests/ci_excluded.txt | sed 's|^|--ignore=|' | tr '\n' ' ')
          python -m pytest -q -p no:cacheprovider -p no:xdist --durations=10 \
            -m serial_ddl $IGNORES tests/scm/

  # The executing backend gate, run in parallel under pytest-xdist `-n auto`.
  #
  # It replaced a serial job of the same name because that job was the whole
  # workflow's critical path: the same suite took about 21.5 minutes serially and
  # runs here in about 12.5. Every other job finished long before it, so the wall
  # clock of a green run was essentially this one number.
  #
  # `--dist loadfile` is load-bearing, NOT an optimization, and must not be
  # dropped. About 38 test files follow the suite's established pattern of a
  # per-file unique marker, an autouse fixture that wipes rows carrying that
  # marker, and real commits against the shared database - a pattern that assumes
  # the tests of one file run serially. xdist's default `--dist load` scatters a
  # single file's tests across workers, and one worker's wipe/seed then collides
  # with another worker's committed rows. That is not theoretical: the trial run
  # that preceded this cutover (the same job, non-blocking, without loadfile)
  # failed with five UniqueViolation errors on `respond_contacts_phone_number_key`
  # from tests/test_conversation_sla_neighbours.py, reproduced locally with `-n 4`
  # and gone under `--dist loadfile`. Per-file distribution serializes exactly the
  # unit those fixtures assume, so the whole class of collisions disappears with
  # one flag instead of 38 file rewrites.
  #
  # Per-worker process state was already safe: each xdist worker is its own
  # process, so the process-global state in tests/conftest.py (the RBAC cache, the
  # `_IDEMP_REDIS` list, the `_BLANK` blank-schema dict whose scratch schema names
  # carry the owning PID) cannot be shared between workers. The file-scoped
  # shared-database fixtures were the one gap, and that is what loadfile closes.
  #
  # tests/scm is excluded here because `test-backend-scm` runs it in parallel,
  # exactly as it did under the serial job.
  #
  # tests/test_migration_*.py is the one case loadfile cannot cover: several of
  # those files run real DDL through `pg_session` against tables that OTHER
  # files' tests also touch, so the collision is cross-file, not within one
  # file. Those tests run in a dedicated serial step below, on the `serial`
  # matrix entry only.
  #
  # Never on a `pull_request` event (owner ruling 2026-09-29, fast PR gate):
  # six shards at ~15 min each were ~60% of a PR run's ~190 job-minutes on
  # the 20-concurrent-job Free plan. The suite runs for the merge-queue
  # entry (the exact merge result) and for a release (workflow_dispatch
  # without skip_tests). A skipped job still reports, as "skipped", which a
  # ruleset's required status check accepts, so listing these six as
  # required blocks nothing on the PR and gates the queue for real. The
  # test files a PR changes do run on the PR: `test-backend-changed` below.
  # One exception (CI-SPEED, 1 Oct 2026): a PR whose import-based selection
  # exceeds 3600 estimated CPU-s (`backend_full`, point 5 of `changes`) runs these six
  # shards, and the SCM shards, instead of the changed-files job.
  test-backend:
    name: Backend test suite (Postgres, xdist)
    needs: [changes]
    if: >-
      needs.changes.outputs.backend == 'true'
      && (github.event_name != 'pull_request' || needs.changes.outputs.backend_full == 'true')
    runs-on: ubuntu-latest
    # The suite is CPU-bound (~3 s of CPU per test across 9k tests) and a
    # standard runner has 4 vCPUs, so one job takes ~29 min no matter how the
    # database is tuned. Six runners in parallel, each still xdist across its
    # own 4 cores, is 6x the CPU. pytest-split assigns every collected test to
    # exactly one group, so the six groups together are the full suite and no
    # test runs twice or is dropped.
    #
    # Shards are balanced by the committed `sorento_crm_backend/.test_durations`
    # (see the "Run backend suite under xdist" step below), not by test count -
    # a count-based split measured 6:10 to 22:08 across 6 shards (run
    # 35951319369, 2026-09-24). A test missing from the file gets the average
    # duration, so a brand-new test does not need a manual refresh to be
    # balanced correctly. Refresh the committed file when the longest shard
    # drifts more than ~3 min above the shortest.
    #
    # The seventh entry, `serial`, runs no xdist pass: it holds the two
    # serial steps (tests/test_migration_*.py and `-m serial_ddl`, ~2.5 min
    # plus ~1.5 min of setup) that used to ride on shard 1 after its xdist
    # pass, which made shard 1 the release's critical path by that much on
    # top of its own imbalance (CI-SPEED, run 36875899060: shard 1 43.8 min,
    # shards 2-6 14-22 min). On its own runner it finishes long before any
    # balanced shard, so it is off the critical path whatever the balance.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, serial]
    services:
      postgres:
        # pgvector image, not plain postgres: the embedding tables need the
        # `vector` extension, which bootstrap_env creates.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sorento
          POSTGRES_PASSWORD: sorento
          POSTGRES_DB: sorento_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sorento:sorento@localhost:5432/sorento_ci
      DIRECT_URL: postgresql://sorento:sorento@localhost:5432/sorento_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-dummy-secret
      JWT_ALGORITHM: HS256
      # This job starts no frontend, so the Dealer Kit PDF render tests cannot
      # run here, and an absent frontend is a FAILURE rather than a silent skip,
      # so the opt-out has to be stated. No CI job runs them any more: the
      # real-browser render job was removed on 2026-08-17 (about 7 minutes on
      # every PR, recurring out-of-memory failures in its frontend build, and
      # the last Playwright user in the repo). They stay in the suite as a
      # local check; the recipe is in tests/test_dealer_kit_pdf_render.py.
      DEALER_KIT_RENDER_TESTS: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sorento_crm_backend/requirements.txt

      - name: Install dependencies
        working-directory: sorento_crm_backend
        run: pip install -r requirements.txt

      # `alembic upgrade head` CANNOT build this schema from zero - its first
      # revision alters a table no migration creates (see bootstrap_env.py).
      # bootstrap_env creates the schema from the ORM models, adds the scm views,
      # seeds reference data (roles / order statuses / permissions), then stamps
      # alembic at head.
      # Throwaway database: durability costs the suite fsync on every commit for
      # nothing. All three settings are reloadable (SIGHUP context), no restart.
      - name: Relax Postgres durability for the test run
        run: |
          # One -c per statement: a multi-statement -c runs in one transaction
          # and ALTER SYSTEM refuses to run inside a transaction block.
          # $DATABASE_URL carries the job's own database name (the two backend
          # jobs use different ones), so target that rather than a literal.
          PSQL="psql $DATABASE_URL -v ON_ERROR_STOP=1"
          $PSQL -c "ALTER SYSTEM SET fsync = off" \
                -c "ALTER SYSTEM SET synchronous_commit = off" \
                -c "ALTER SYSTEM SET full_page_writes = off" \
                -c "ALTER SYSTEM SET max_locks_per_transaction = 1024" \
                -c "SELECT pg_reload_conf()"
          # max_locks_per_transaction is postmaster-level, so the service container
          # is restarted for it to take. Without it the lock table (default 64 x
          # max_connections) ran out under xdist - four workers each holding a
          # scratch schema of ~400 relations - and a test died with "out of shared
          # memory" (run 33130805987, test_media_quota_serialization). The three
          # durability settings above survive the restart: ALTER SYSTEM persists.
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U sorento && break
            sleep 1
          done
          $PSQL -c "SHOW fsync" -c "SHOW synchronous_commit" -c "SHOW full_page_writes" \
                -c "SHOW max_locks_per_transaction"

      - name: Bootstrap the database
        working-directory: sorento_crm_backend
        run: python -m scripts.bootstrap_env

      # Everything except tests/ci_excluded.txt - see that file for why each entry
      # is out (they assert against business data a fresh database has no reason
      # to contain) - MINUS tests/scm, which `test-backend-scm` runs in parallel,
      # MINUS tests/test_migration_*.py, which the serial step below runs alone,
      # MINUS anything marked `serial_ddl`, which the step after that runs alone.
      #
      # `--durations=30` prints the 30 slowest tests of the run. It is the only
      # per-test timing this job produces, and reviewers are pointed at it by
      # documentation/reference/PR-CHECKLIST.md ("Test cost") to justify a new
      # slow test rather than discovering it three weeks later as wall clock.
      - name: Run backend suite under xdist (executing gate)
        if: matrix.shard != 'serial'
        working-directory: sorento_crm_backend
        run: |
          IGNORES=$(grep -vE '^\s*#|^\s*$' tests/ci_excluded.txt | sed 's|^|--ignore=|' | tr '\n' ' ')
          echo "excluding $(echo "$IGNORES" | wc -w) path(s) plus tests/scm, tests/test_migration_*.py and the serial_ddl tests; shard ${{ matrix.shard }} of 6"
          python -m pytest -q -p no:cacheprovider -n auto --dist loadfile --durations=30 \
            --splits 6 --group ${{ matrix.shard }} \
            --store-durations --durations-path .test_durations \
            --ignore-glob='tests/test_migration_*.py' \
            -m "not serial_ddl" \
            $IGNORES --ignore=tests/scm tests/

      # Balances the 6 groups by the checked-out committed `.test_durations`
      # (`duration_based_chunks`, pytest-split's default algorithm - not
      # overridden to `least_duration`), instead of the old count-based split
      # that measured 6:10 to 22:08 across shards (run 35951319369,
      # 2026-09-24). A test missing from the file gets the average duration,
      # so a brand-new test needs no manual refresh before it is balanced
      # correctly.
      #
      # `--store-durations` then overwrites `.test_durations` with that same
      # committed history plus fresh numbers for the tests THIS shard ran, so
      # every shard's artifact carries the FULL file, not just its own slice.
      # Refreshing the committed file is therefore: download every shard's
      # artifact from a run, merge them (any shard's copy is a safe base -
      # for a key it did not run, its value is still the unchanged committed
      # baseline, identical across all shards' copies), and commit the
      # result. Refresh when the longest shard drifts more than ~3 min above
      # the shortest; a small drift is not worth the churn.
      - name: Upload backend shard durations artifact
        if: always() && matrix.shard != 'serial'
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ matrix.shard }}
          path: sorento_crm_backend/.test_durations
          retention-days: 7
          # The durations file is a dotfile; upload-artifact excludes those by
          # default and silently uploads nothing ("No files were found").
          include-hidden-files: true

      # Migration tests run serially, outside the xdist pool, on the `serial`
      # matrix entry only (no xdist pass runs there).
      #
      # Some of them (324, 325, 354, 370, 375_user_discontinued_scopes, 395, 400,
      # 422, 443) run real ALTER TABLE / DROP against shared tables through
      # `pg_session`, which holds the AccessExclusiveLock until the test's
      # transaction rolls back. `--dist loadfile` above serializes the tests of
      # ONE file; it does nothing for two files on two workers touching the same
      # table. Run 33894859525 (main, 2026-09-04) hit exactly that: the 400 test's
      # `ALTER TABLE projects.order_inquiry_rows DROP COLUMN` deadlocked against
      # tests/test_order_inquiry_place_on_po.py's SELECT on another worker and
      # Postgres killed the DDL side. The whole migration set is a few seconds of
      # test time, so it runs here serially, with nothing else on the database.
      # It rode on shard 1 from 2026-09-24 (then the shortest shard) until
      # CI-SPEED (2026-10-01) gave it its own entry: by then shard 1 was the
      # longest, and these steps added 2.5 min to the release's critical
      # path (run 36875899060: 1:54 migrations + 0:37 serial_ddl). Glob rather
      # than a list: a future migration test with DDL is covered without
      # anyone remembering to register it.
      - name: Run migration tests serially (executing gate)
        if: matrix.shard == 'serial'
        working-directory: sorento_crm_backend
        run: |
          python -m pytest -q -p no:cacheprovider -p no:xdist --durations=10 \
            tests/test_migration_*.py

      # The same hazard outside the `test_migration_*.py` naming, which is why the
      # marker exists alongside the glob: `tests/test_ingest_contract_v2.py`'s
      # TestMigration473WidensTheSourceCheck holds an AccessExclusiveLock on the
      # SHARED `scm.order_link_claim` (DROP CONSTRAINT / ADD CONSTRAINT on a plain
      # `engine.connect()`), and nothing about its filename says so. Same cycle as
      # issue #987, same treatment, on the `serial` entry only.
      #
      # `-m serial_ddl` over the whole tree rather than a path list: a future test
      # that marks itself is picked up without anyone remembering to register it
      # here. Collection of tests/ costs about 25 seconds, on a runner that
      # does nothing else.
      - name: Run view/DDL tests serially (executing gate)
        if: matrix.shard == 'serial'
        working-directory: sorento_crm_backend
        run: |
          IGNORES=$(grep -vE '^\s*#|^\s*$' tests/ci_excluded.txt | sed 's|^|--ignore=|' | tr '\n' ' ')
          python -m pytest -q -p no:cacheprovider -p no:xdist --durations=10 \
            -m serial_ddl --ignore-glob='tests/test_migration_*.py' \
            $IGNORES --ignore=tests/scm tests/

  # The backend test files a `ci`-labelled PR changes, executed on the PR.
  #
  # `test-backend` never runs on a pull_request (above), so until this job a
  # PR that changed a test outside tests/scm never executed it before the
  # merge queue or the release: #1387 changed only
  # tests/test_media_job_lifecycle.py (a de-flake of a test that had just
  # failed a release run) and its `ci` run (36665697605) was the alembic
  # gate, `changes` and validate-backend's collect-only. `changes` lists the
  # changed `tests/**/test_*.py` files (`backend_tests`, point 4 of its
  # comment); this job runs exactly those, on the same Postgres + Redis
  # bootstrap as the shards (in the shards' two-pass split, see below).
  # The list is trimmed first: a deleted
  # or renamed-away path is in the PR's file list but not in the checkout,
  # and a ci_excluded.txt entry asserts against business data an empty
  # database does not hold (that file says why); either would fail pytest on
  # collection, not on the test. An empty list after trimming is a pass with
  # nothing run, printed as such.
  #
  # Off a PR the list is empty by construction and the full shards cover
  # every file, so this job is skipped there; the label gating and the area
  # flags are untouched.
  #
  # Since CI-SPEED (1 Oct 2026) the list is the import-based selection
  # (point 5 of `changes`): the changed test files plus every test file
  # that imports a changed backend module, up to 3600 estimated CPU-s (above that the
  # shards run instead and this job skips). So the run step splits like the
  # shards: tests/scm and the rest in separate sessions, xdist `--dist
  # loadfile` for the bulk, then the `serial_ddl` and tests/test_migration_*.py
  # files serially.
  test-backend-changed:
    name: Backend changed tests (Postgres)
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.backend_tests != ''
      && needs.changes.outputs.backend_full != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sorento
          POSTGRES_PASSWORD: sorento
          POSTGRES_DB: sorento_changed_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sorento:sorento@localhost:5432/sorento_changed_ci
      DIRECT_URL: postgresql://sorento:sorento@localhost:5432/sorento_changed_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-dummy-secret
      JWT_ALGORITHM: HS256
      # No frontend in this job either - see the same note on `test-backend`.
      DEALER_KIT_RENDER_TESTS: skip
      BACKEND_TESTS: ${{ needs.changes.outputs.backend_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before the Python setup on purpose: a list that trims to nothing
      # (every changed test file deleted, or excluded) needs no database.
      # Asserted by sorento_crm_backend/tests/test_ci_docs_only_filter.py
      # (test_changed_tests_step_*), which runs this step's shell against a
      # scratch checkout.
      - name: Select the changed test files to run
        id: select
        run: |
          # Repo-relative paths in, sorento_crm_backend-relative paths out:
          # pytest runs from that directory, like the shards.
          excluded=$(grep -vE '^\s*#|^\s*$' sorento_crm_backend/tests/ci_excluded.txt || true)
          run=""; dropped=""
          for path in $BACKEND_TESTS; do
            rel="${path#sorento_crm_backend/}"
            if [ ! -f "$path" ]; then
              dropped="$dropped  $rel (not in the checkout: deleted or renamed away)"$'\n'
            elif printf '%s\n' "$excluded" | grep -qxF "$rel"; then
              dropped="$dropped  $rel (listed in tests/ci_excluded.txt)"$'\n'
            else
              run="$run $rel"
            fi
          done
          run="${run# }"
          [ -z "$dropped" ] || { echo "not run:"; printf '%s' "$dropped"; }
          if [ -n "$run" ]; then
            echo "changed test files to run:"; printf '%s\n' $run | sed 's/^/  /'
          else
            echo "no changed test file left to run"
          fi
          echo "files=$run" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.select.outputs.files != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sorento_crm_backend/requirements.txt

      - name: Install dependencies
        if: steps.select.outputs.files != ''
        working-directory: sorento_crm_backend
        run: pip install -r requirements.txt

      # Same as the shards: durability off for a throwaway database, and the
      # lock table sized for the scratch schemas the fixtures create.
      - name: Relax Postgres durability for the test run
        if: steps.select.outputs.files != ''
        run: |
          PSQL="psql $DATABASE_URL -v ON_ERROR_STOP=1"
          $PSQL -c "ALTER SYSTEM SET fsync = off" \
                -c "ALTER SYSTEM SET synchronous_commit = off" \
                -c "ALTER SYSTEM SET full_page_writes = off" \
                -c "ALTER SYSTEM SET max_locks_per_transaction = 1024" \
                -c "SELECT pg_reload_conf()"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U sorento && break
            sleep 1
          done
          $PSQL -c "SHOW fsync" -c "SHOW synchronous_commit" -c "SHOW full_page_writes" \
                -c "SHOW max_locks_per_transaction"

      - name: Bootstrap the database
        if: steps.select.outputs.files != ''
        working-directory: sorento_crm_backend
        run: python -m scripts.bootstrap_env

      - name: Run the changed test files (executing gate)
        if: steps.select.outputs.files != ''
        working-directory: sorento_crm_backend
        env:
          FILES: ${{ steps.select.outputs.files }}
        run: |
          # The shards' split. tests/scm and the rest run as separate pytest
          # sessions, as on the shards: several main-tree files import
          # `tests.scm.conftest` by module name, and in one session with
          # tests/scm files that import keeps pytest from registering it as
          # tests/scm's conftest (`fixture 'scm_app' not found`; #1411's
          # selection hit it). Per tree: xdist `--dist loadfile` for
          # everything but `serial_ddl`, then `serial_ddl` serially; then
          # tests/test_migration_*.py serially. Exit 5 (nothing collected,
          # e.g. no `serial_ddl` test in the list) is not a failure; every
          # pass runs even after one fails, and the job fails on any.
          main=""; scm=""; migrations=""
          for f in $FILES; do
            case "$f" in
              tests/test_migration_*.py) migrations="$migrations $f" ;;
              tests/scm/*) scm="$scm $f" ;;
              *) main="$main $f" ;;
            esac
          done
          rc=0
          run() { python -m pytest -q -p no:cacheprovider "$@" || { r=$?; [ "$r" -eq 5 ] || rc=$r; }; }
          for pool in "$main" "$scm"; do
            [ -n "$pool" ] || continue
            run -n auto --dist loadfile --durations=20 -m "not serial_ddl" $pool
            run -p no:xdist --durations=10 -m serial_ddl $pool
          done
          [ -z "$migrations" ] || run -p no:xdist --durations=10 $migrations
          exit "$rc"

  validate-frontend:
    name: Validate frontend (vitest)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # The FULL vitest suite (~950 files / ~10.5k tests) on a 2-vCPU runner was
    # the single longest gate (19.5 min). Split into 4 shards that run in
    # parallel matrix jobs instead of one job iterating serially; together
    # they cover the exact same suite (vitest's `--shard` partitions the full
    # collected file list, nothing runs twice or is dropped).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the frontend Dockerfile base (node:20-alpine).
          node-version: 20
          cache: npm
          cache-dependency-path: sorento_crm_frontend/package-lock.json

      # `--force` mirrors local install: React 19 peer-dep conflicts are expected
      # and documented in CLAUDE.md.
      - name: Install dependencies
        working-directory: sorento_crm_frontend
        run: npm ci --force

      # One shard of the FULL vitest suite. Needs no database or service
      # containers; api-client calls are mocked. Single-test flakes under
      # runner load are absorbed by `retry: 2` in vitest.config.ts (CI only);
      # a test that fails three times in a row still blocks the deploy.
      - name: Run vitest suite (executing gate)
        working-directory: sorento_crm_frontend
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # Type-checks application code on the runner, in parallel with the test
  # gates, instead of inside the Docker build (see next.config.mjs and the
  # frontend Dockerfile's NEXT_SKIP_TYPECHECK). This job replaces that
  # in-image `next build` check with the same effective coverage: Next's own
  # build-time type check runs `tsc` over the FULL tsconfig program
  # (including test files), then discards diagnostics that match its own
  # ignore regexes for `__tests__`/`__mocks__` directories and
  # `*.spec.*`/`*.test.*` files (see
  # node_modules/next/dist/lib/typescript/runTypeCheck.js upstream).
  # tsconfig.typecheck.json excludes exactly that same set, so this job is
  # parity with what always gated a deploy, not a new gate; vitest owns
  # test-file correctness. Excluding those files still leaves 21 pre-existing
  # type errors in 11 of them, tracked in issue #821, not fixed in this lane.
  typecheck-frontend:
    name: Type-check frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sorento_crm_frontend/package-lock.json

      - name: Install dependencies
        working-directory: sorento_crm_frontend
        run: npm ci --force

      # tsconfig.json's `include` lists `.next/types/**/*.ts` (Next's
      # generated route-param types), which does not exist on a bare
      # checkout - only `next build`/`next dev` normally produce it. Without
      # this, tsc silently type-checks nothing for those files rather than
      # failing, so a broken route type would pass here and only surface in
      # the (skipped) Docker build.
      - name: Generate Next route types
        working-directory: sorento_crm_frontend
        run: npx next typegen

      - name: Run tsc --noEmit
        working-directory: sorento_crm_frontend
        run: npm run typecheck

  # Builds and pushes all three images in parallel with the test/validate gates
  # above, instead of serially inside build-and-deploy after they all pass.
  # This is the single biggest win in this slice: the old build-and-deploy job
  # spent 6.5+2.3+0.3 = ~9 min building images with no buildx and no
  # cache-from/cache-to, after every gate had already finished.
  #
  # Pushing a SHA-tagged image for a commit whose gates have not finished (or
  # fail) is safe: the deploy step below only pulls by the exact commit SHA,
  # and only after build-and-deploy's `needs` (which includes every gate) is
  # green. An image sitting in the registry for a commit that never deploys
  # costs registry storage, nothing else. `validate-backend` and
  # `validate-mcp` already warm the `backend` and `mcp` gha cache scopes this
  # job reads via `cache-from`, so those two matrix legs are close to free.
  build-images:
    name: Build and push images
    needs: [changes]
    # Same condition as build-and-deploy: only build for real on a release
    # (workflow_dispatch on main). A push to main builds nothing (see the
    # `push` trigger comment), a dispatch on any other ref runs the suite
    # only, and a PR run still needs the images to exist for its own
    # validate-backend/validate-mcp legs, which build separately (load:
    # true, no push) and are unaffected by this job's `if`.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See validate-backend: authenticate so base-image pulls aren't
      # anonymous (avoids Docker Hub rate-limit timeouts on shared runner IPs).
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      # Frontend only, UAC-19 (provisional): restores the `.next/cache`
      # BuildKit mount across separate CI runs (a BuildKit cache mount
      # otherwise lives only on the runner that created it, and GitHub-hosted
      # runners are ephemeral). `.next/cache` ONLY, not npm: the whole repo
      # shares a single 10 GB `actions/cache` quota, and an eviction there can
      # push out the `type=gha` layer-cache scopes the frontend/backend/mcp
      # builds all read via `cache-from` - a much bigger loss than the npm
      # mount, whose `npm ci` layer is already a `type=gha` cache hit unless
      # package-lock.json changed. Record the before/after cache size at
      # UAC-19 (`gh api .../actions/caches`). If `.next/cache` alone does not
      # deliver a faster frontend build within two main deploys, drop this
      # step and the next one and keep just the `cache-from`/`cache-to:
      # type=gha` below - see UAC-19.
      - name: Restore frontend buildkit cache directory
        if: matrix.service == 'frontend'
        id: fe-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.buildkit-cache/next
          key: ${{ runner.os }}-fe-buildkit-${{ hashFiles('sorento_crm_frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fe-buildkit-${{ hashFiles('sorento_crm_frontend/package-lock.json') }}-
            ${{ runner.os }}-fe-buildkit-

      - name: Inject frontend buildkit cache mounts
        if: matrix.service == 'frontend'
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              ".buildkit-cache/next": "/app/.next/cache"
            }
          skip-extraction: ${{ steps.fe-cache.outputs.cache-hit }}

      # Frontend build-args need the NEXT_PUBLIC_VAPID_PUBLIC_KEY secret (see
      # the frontend Dockerfile); backend and mcp Dockerfiles do not declare
      # that ARG, so they get their own step rather than an unused build-arg
      # on every matrix leg.
      # SHA tag ONLY here, never the moving `<svc>-${RELEASE_TAG}` tag: the
      # server compose defaults to `${IMAGE_TAG:-1.0.1}`, so a manual `docker
      # compose up` on the server with no IMAGE_TAG set pulls whatever
      # `<svc>-1.0.1` currently points at. Before this lane that tag was only
      # ever pushed after every gate had passed (the old build-and-deploy ran
      # after `needs`); build-images runs IN PARALLEL with the gates, so
      # pushing the release tag here could point it at a commit that goes on
      # to fail one. build-and-deploy's "Promote gated images to the release
      # tag" step moves the release tag, once all gates are green, with a
      # registry-side manifest copy (no rebuild, no pull).
      - name: Build and push frontend image
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          tags: ${{ env.IMAGE_REPO }}:frontend-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push image
        if: matrix.service != 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: ./sorento_crm_${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-and-deploy:
    needs:
      [
        changes,
        check-migration-heads,
        validate-backend,
        validate-mcp,
        validate-frontend,
        test-backend,
        test-backend-scm,
        build-images,
        typecheck-frontend,
      ]
    # A release only: workflow_dispatch on main. Never a push to main (owner
    # decision 2026-09-29: a merge does not deploy), never a merge-queue
    # entry (it only validates the merge candidate).
    #
    # `!cancelled()` instead of the default success-of-every-need: on a
    # release with skip_tests every test job in `needs` is SKIPPED on
    # purpose, and the default rule would skip this job with them. So the
    # gates are checked by result instead: the alembic gate and the image
    # build must have succeeded, and no need may have failed or been
    # cancelled; a skipped need is accepted because on a dispatch the only
    # way a need skips is skip_tests. Wrapped in `${{ }}` because the
    # expression starts with `!`, which YAML would otherwise read as a tag.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && needs.check-migration-heads.result == 'success'
      && needs.build-images.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    # The owner's approval gate. The GitHub environment "production" (required
    # reviewer jayson-odoo, deployment branches: main only) holds this job
    # BEFORE its first step until the owner approves it under the run's
    # "Review deployments" button (or rejects it, which fails the job and
    # mails "deploy failed"). Everything that touches the server (the release
    # tag promotion, the scp, the two ssh steps) lives in this one job, so
    # this is the only place the environment is needed.
    environment:
      name: production
      url: https://fe-sorento.foundryx.my
    # Job-level, and a fixed group name rather than the workflow-level group
    # above (which is per-run for push events, so it never serializes deploys
    # on its own). Two merges close together used to run two deploys overlapped
    # - the second recreated the worker while the first was still mid
    # blue/green, killing in-flight RQ jobs (AbandonedJobError). This queues
    # the second deploy behind the first instead. cancel-in-progress is false
    # because every merge must still deploy, none can be dropped for a later
    # one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deploy targets
        id: targets
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "mcp=true" >> "$GITHUB_OUTPUT"
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      # Images are built and pushed by `build-images` (matrix, runs in
      # parallel with the gates), SHA-tagged only. `build-and-deploy`'s own
      # `needs` (above) is every gate, so reaching this point means they are
      # all green - only now does the moving `<svc>-${RELEASE_TAG}` tag get
      # pointed at this commit's already-pushed SHA-tagged image. Login is
      # for `docker buildx imagetools`, which still needs registry auth even
      # though it never pulls or rebuilds image content.
      - name: Login to Docker Hub
        if: steps.targets.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `docker buildx imagetools` is a registry-side manifest copy and does
      # not need an active builder to run, but ubuntu-latest's bundled buildx
      # plugin version is not pinned - set one up explicitly rather than
      # depend on whatever ships on the runner image that week.
      - name: Set up Docker Buildx
        if: steps.targets.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Promote gated images to the release tag
        if: steps.targets.outputs.should_deploy == 'true'
        run: |
          for svc in frontend backend mcp; do
            docker buildx imagetools create \
              -t "$IMAGE_REPO:${svc}-${RELEASE_TAG}" \
              "$IMAGE_REPO:${svc}-${GITHUB_SHA}"
          done

      - name: Sync deploy script to server
        if: steps.targets.outputs.should_deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 1m
          # Server has no git repo. CI is the source of truth for the deploy
          # script ONLY. docker-compose.yml is gitignored (carries secret
          # defaults) so it never exists in CI checkouts — prod compose at
          # /opt/sorento-crm2/docker-compose.yml is edited manually on the
          # server. Keep the local root copy and prod in sync by hand.
          source: "scripts/blue_green_deploy.sh"
          target: "/opt/sorento-crm2"
          overwrite: true
          strip_components: 0

      - name: Deploy to Server (blue/green)
        if: steps.targets.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          # Must outlast the worker's `stop_grace_period` (3600s), or this step is
          # the thing that fails a deploy that is otherwise fine. Step 6 of
          # blue_green_deploy.sh recreates the worker, and `docker compose up -d
          # --force-recreate worker` BLOCKS until the old container has stopped -
          # which is now "until the import it is running finishes". Users are
          # already on the new colour by then (the nginx swap is step 4), so the
          # only thing at risk is this job's exit code. 70m = the grace plus the
          # pull, the 4-minute health wait, the 30s drain and the 90s scheduler check.
          command_timeout: 70m
          script: |
            set -e
            cd /opt/sorento-crm2
            chmod +x ./scripts/blue_green_deploy.sh
            IMAGE_TAG="${{ github.sha }}" ./scripts/blue_green_deploy.sh

      - name: Verify public endpoints
        if: steps.targets.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 1m
          command_timeout: 2m
          script: |
            set -e
            # Frontend / backend via host nginx (public domain), with a WAIT.
            #
            # The nginx swap (step 4 of blue_green_deploy.sh) points the upstream at the
            # new colour the moment its container reports healthy, and Next.js then needs
            # a few seconds more before it answers the first request: on run 34855082817
            # this check got six 504s over 30 seconds and failed a deploy that was
            # entirely fine (blue healthy, nginx swapped, worker recreated, alembic at
            # 511). So it now polls for up to 90 seconds, prints each attempt's code and
            # the elapsed time, and only then tries local nginx and gives up. 90s plus
            # the MCP check below sits inside this step's own `command_timeout: 2m`.
            started=$(date +%s)
            ok=""
            while [ $(( $(date +%s) - started )) -lt 90 ]; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
                https://fe-sorento.foundryx.my/ || true)
              waited=$(( $(date +%s) - started ))
              echo "public URL: HTTP ${code:-000} after ${waited}s"
              case "$code" in
                2*|3*) ok="yes"; break;;
              esac
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "public URL never answered in 90s, trying local nginx"
              curl -fsS -o /dev/null http://127.0.0.1/
            fi
            # MCP via host nginx (n8n entrypoint, port stays 8765 forever)
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/mcp || true)
            # 406 expected for plain GET (MCP demands SSE Accept header); means nginx reached MCP.
            case "$code" in
              200|405|406) echo "MCP reachable via nginx (HTTP $code)";;
              *) echo "ERROR: MCP via nginx returned $code"; exit 1;;
            esac

  notify-owner:
    name: Notify owner by email
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    # `always()` so a FAILED deploy still mails (a failed gate skips
    # build-and-deploy, whose result is then `skipped`, and that mails
    # "failed" too, which is right: the release did not ship). Releases
    # only: a push to main and a queue entry deploy nothing and mail nothing.
    if: >-
      always()
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Check SMTP configuration
        id: smtp
        # secrets are not available in `if` expressions; resolve via env and expose a boolean output.
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$OWNER_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute notification content
        id: notify
        run: |
          RESULT="${{ needs.build-and-deploy.result }}"
          if [ "$RESULT" = "success" ]; then
            echo "subject=✅ Sorento deploy succeeded (${GITHUB_REF_NAME})" >> "$GITHUB_OUTPUT"
            echo "status_text=SUCCEEDED" >> "$GITHUB_OUTPUT"
          else
            echo "subject=❌ Sorento deploy failed (${GITHUB_REF_NAME})" >> "$GITHUB_OUTPUT"
            echo "status_text=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Send deployment email
        if: steps.smtp.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.notify.outputs.subject }}
          to: ${{ secrets.OWNER_EMAIL }}
          from: Sorento Deploy Bot <${{ secrets.SMTP_USERNAME }}>
          body: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Warn when email secrets are missing
        if: steps.smtp.outputs.configured != 'true'
        run: |
          echo "Email notification skipped: set SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, OWNER_EMAIL secrets."

  # Makes the `ci` label a one-shot trigger rather than a standing state: the
  # instant a `pull_request labeled` event with label `ci` fires (which is
  # also what let every other job above run this time), this job removes the
  # label again. GitHub fires a fresh `labeled` event every time the label is
  # ADDED, even if it was already present and removed since, so the
  # orchestrator re-labels the PR to re-run CI against its current head - a
  # push alone never does, per the trigger comment above. `always()` plus no
  # `needs` means this runs independently of whether the gated jobs above
  # passed or failed; the label removal itself must not block on their
  # result.
  release-ci-label:
    name: Release ci label (one-shot trigger)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'ci'
    permissions:
      pull-requests: write
    steps:
      - name: Remove ci label so a future add re-triggers CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label ci

