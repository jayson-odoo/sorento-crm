; pgbouncer for active-active (HA-CF-FAILOVER). The [databases] section is NOT here: it is in
; route/route.ini, written by `infra/scripts/ha-pg.sh route local|peer` and reloaded on every
; promotion (the directory root-owned 0755, the file 0644). Copy the [pgbouncer] settings from today's prod pgbouncer first (pool sizes, mode).
%include /etc/pgbouncer/route/route.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; hba: the admin console from the container itself only, the app from the compose network only
; (security review N5); templates/active-active/pgbouncer-hba.conf
auth_type = hba
auth_hba_file = /etc/pgbouncer/pg_hba.conf
auth_file = /etc/pgbouncer/userlist.txt
; KEEP prod's pool_mode (SHOW CONFIG on prod first). Do NOT switch session -> transaction: the app
; holds SESSION-level advisory locks (chatbot agent turn per contact, app/services/chatbot/agent/
; loop.py:821-830; product_drawing_request_service.py:304; product_spec_preview.py:311), which
; transaction pooling would break (security review F1). A re-point works in either mode: the
; controller RELOADs, then KILLs + RESUMEs the app database, so no connection stays pinned to
; the old target (a running standby included). The drill runs session mode.
pool_mode = <PROD_POOL_MODE>
max_client_conn = <PROD_MAX_CLIENT_CONN>
default_pool_size = <PROD_DEFAULT_POOL_SIZE>
admin_users = <PGBOUNCER_ADMIN>
; the controller re-points with RELOAD, KILL <db>, RESUME <db> (ha-pg.env PGB_ADMIN, PGB_DATABASES)
server_check_query = select 1
server_lifetime = 600
; after a re-point, login failures against the OLD primary must not lock clients out for long
; (default 15 s): a newly promoted primary has to answer Cloudflare's next check
server_login_retry = 2
; A cut link sends no reset: without these a server connection over the link hangs until the
; kernel gives up (about 15 minutes) and the app request with it. With them pgbouncer drops it in
; about 10 s, the app gets an error and reconnects (drill finding, active-active round 2).
tcp_keepalive = 1
tcp_keepidle = 5
tcp_keepintvl = 2
tcp_keepcnt = 3
tcp_user_timeout = 10000
