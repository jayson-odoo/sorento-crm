# pgbouncer's own hba (active-active, security review N5). First match wins.
# The admin console (RELOAD, RECONNECT for the controller) only from inside the container.
host  pgbouncer   <PGBOUNCER_ADMIN>  127.0.0.1/32       scram-sha-256
host  pgbouncer   all                0.0.0.0/0          reject
# The app (and the scheduler's helpers) from this node's compose network only.
host  <APP_DB>    <APP_USER>         <COMPOSE_SUBNET>   scram-sha-256
host  all         all                0.0.0.0/0          reject
