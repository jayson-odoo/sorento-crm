# HAProxy in front of Redis on each CRM node (HA-CF-FAILOVER active-active).
# /etc/sorento-ha/haproxy-redis.cfg, mode 0640 root:<HAPROXY_UID>: it holds the hacheck password.
# Sends every connection to whichever Redis is the master: this node's when it is the primary
# node, the peer's (over the private link) when this node is the standby. The controller switches
# the roles (`ha-pg.sh route`); this file never changes.
global
    maxconn 4096
# Docker's DNS, so a recreated Redis container (new address) is found again (review should-fix 1).
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
defaults
    mode tcp
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 2s
frontend redis_in
    bind 0.0.0.0:6380
    default_backend redis_master
backend redis_master
    option tcp-check
    tcp-check connect
    # The `hacheck` user may only run INFO / PING / QUIT (templates/active-active/users.acl).
    tcp-check send AUTH\ hacheck\ <HACHECK_PASSWORD>\r\n
    tcp-check expect string +OK
    tcp-check send INFO\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    # The local Redis first; the peer's only while it is the master and the local one is not.
    # When local becomes the master again, sessions still on the peer are closed (review
    # should-fix 2): no connection keeps writing to a Redis about to turn replica.
    # init-addr none: HAProxy starts even if `redis` does not resolve yet at boot.
    server local redis:6379 check inter 1s fall 2 rise 2 resolvers docker init-addr none on-marked-down shutdown-sessions on-marked-up shutdown-backup-sessions
    server peer <PEER_WG_IP>:6379 check inter 1s fall 2 rise 2 backup on-marked-down shutdown-sessions
