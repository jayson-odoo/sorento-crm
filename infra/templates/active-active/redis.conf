# Redis on BOTH CRM nodes, active-active (HA-CF-FAILOVER, security review S1/N6).
# /etc/sorento-ha/redis.conf, mode 0640 root:<REDIS_UID> (999 in the official image), mounted
# read-only. Passwords live here and in users.acl only: never on the command line, never in
# `docker inspect`. Generate each with `openssl rand -hex 32` (hex: safe in URLs and configs).
aclfile /etc/redis/users.acl
appendonly yes
replica-read-only yes
# The replica authenticates to the master as `repl`, which may only replicate.
masteruser repl
masterauth <REPL_PASSWORD>
port 6379
bind 0.0.0.0
protected-mode yes
