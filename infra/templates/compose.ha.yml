# HA override for BOTH CRM nodes (A = CRM box, B = KVM 8):
#   docker compose -f docker-compose.yml -f compose.ha.yml up -d
# Plan: documentation/plans/infra/PLAN-ha-cf-failover-04nov.md sections 2 and 3.
#
# - `db` is plain Postgres 17 (+ pgvector + WAL-G, templates/postgres/Dockerfile), same service
#   name so pgbouncer and the deploy script's DB_SERVICE keep working. Which node is primary is the
#   failover controller's call (infra/scripts/cf_failover.py), never this file's: `restart: "no"`
#   so a reboot leaves it STOPPED and the controller starts it as a standby (rule D1), and no
#   autoheal label (autoheal must never restart a fenced database).
# - Workers and the scheduler sit behind profile `promoted`; infra/scripts/role-watcher.sh
#   starts them only while the local Postgres is primary and stops them otherwise.
# - Migrations: SKIP_MIGRATIONS defaults to 0 (today's behaviour on the primary). The release on
#   the standby sets SKIP_MIGRATIONS=1 (scripts/blue_green_deploy.sh standby mode), or start.sh
#   would run `alembic upgrade head` against the read-only replica and the start would fail.
# - autoheal restarts any app container whose healthcheck turns unhealthy (owner Q3: the 15 min
#   before an app-sick failover are autoheal's).
services:
  db:
    image: <REGISTRY>/sorento-pg17:<PIN>          # built from templates/postgres/Dockerfile
    restart: "no"
    env_file: [walg.env]
    environment:
      # A subdirectory of the volume, so a re-seed can move the old data aside (plan 3c).
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - wal_log_hints=on                # pg_rewind
      - -c
      - hot_standby=on
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_size=4GB
      - -c
      - wal_keep_size=1GB
      - -c
      - max_slot_wal_keep_size=20GB     # a dead standby can never fill the primary's disk
      - -c
      - max_standby_streaming_delay=30s
      - -c
      - wal_sender_timeout=10s          # a cut link is noticed in 10 s (sync standby drop, P4)
      - -c
      - wal_receiver_timeout=10s
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60              # PITR RPO bound about 60 s
      - -c
      - shared_preload_libraries=<PROD_SHARED_PRELOAD_LIBRARIES>   # copy prod's SHOW value; never drop one
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # replication password for pg_rewind / pg_basebackup run in this image (mode 600, uid 999)
      - /etc/sorento-ha/pgpass.container:/var/lib/postgresql/.pgpass:ro
    ports:
      - "127.0.0.1:5432:5432"
      - "<THIS_WG_IP>:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend_blue:
    environment:
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-0}
    labels:
      autoheal: "true"
  backend_green:
    environment:
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-0}
    labels:
      autoheal: "true"
  frontend:
    labels:
      autoheal: "true"

  worker:
    profiles: ["promoted"]
    environment:
      ENABLE_SCHEDULER: "true"
      # Direct to Postgres, not pgbouncer (sorento_crm_backend/app/scheduler/leader.py).
      SCHEDULER_LEADER_DATABASE_URL: ${SCHEDULER_LEADER_DATABASE_URL:?set a direct Postgres URL (not pgbouncer)}
  worker_fast:
    profiles: ["promoted"]

  # The Docker socket is root on the host (security review S4): autoheal never gets it directly.
  # A socket proxy allows only container list / inspect / restart; both images pinned by digest.
  docker_socket_proxy:
    image: <SOCKET_PROXY_IMAGE>@sha256:<DIGEST>
    environment:
      CONTAINERS: "1"
      # POST stays 0: with POST=1 a caller could create a privileged container (root on the
      # host). ALLOW_RESTARTS permits restart alone.
      POST: "0"
      ALLOW_RESTARTS: "1"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [autoheal_net]
    restart: unless-stopped

  autoheal:
    image: <AUTOHEAL_IMAGE>@sha256:<DIGEST>
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      DOCKER_SOCK: tcp://docker_socket_proxy:2375
    networks: [autoheal_net]
    depends_on: [docker_socket_proxy]
    restart: unless-stopped

networks:
  # Internal only: no ports, nothing else attached.
  autoheal_net:
    internal: true
