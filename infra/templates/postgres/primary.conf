# Primary (CRM box). Include from postgresql.conf, or pass as `-c` flags in compose.
# Plan: documentation/plans/infra/PLAN-ha-tier1-n8n-box-27oct.md section 2 "Replication and PITR".
# Changing wal_level / archive_mode needs ONE Postgres restart: do it in a quiet window.

wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
# A dead standby can never fill this disk: past 20 GB of retained WAL the slot is invalidated
# and the standby is re-seeded (pg_basebackup) instead.
max_slot_wal_keep_size = 20GB
max_wal_size = 4GB

archive_mode = on
# WAL-G reads its target and credentials from the environment (templates/walg.env.example).
archive_command = 'wal-g wal-push %p'
# Bounds RPO at about 60 s even when the primary is idle.
archive_timeout = 60

# '*' is safe ONLY inside a container whose port publish is bound to the tunnel address
# (compose `ports: ["<PRIMARY_WG_IP>:5432:5432"]`). On a host-network or bare-metal install,
# list the tunnel and loopback addresses instead of '*'.
listen_addresses = '*'
