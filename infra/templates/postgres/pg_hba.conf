# pg_hba.conf for BOTH CRM nodes, byte-identical on both (HA-CF-FAILOVER).
# Mounted read-only OUTSIDE the data directory (compose.ha.yml: -c hba_file=...), so pg_rewind and
# pg_basebackup, which copy PGDATA from the peer, can never swap it for the peer's copy.
# First match wins. Nothing but these lines is allowed: there is no catch-all `host all all all`.

# Admin over the local socket only (deploy script, ha-pg.sh): OS user = DB user.
local   all          all                                 peer
# The superuser never over TCP, from anywhere (security review B1, carried from the Patroni template).
host    all          postgres      0.0.0.0/0             reject
host    all          postgres      ::/0                  reject
# Replication + the controller's role reads + pg_rewind, from either node's private address
# (both listed, so the file is the same on both nodes and survives a role swap).
host    replication  replicator    <A_WG_IP>/32          scram-sha-256
host    replication  replicator    <B_WG_IP>/32          scram-sha-256
host    postgres     replicator    <A_WG_IP>/32          scram-sha-256
host    postgres     replicator    <B_WG_IP>/32          scram-sha-256
# The app and pgbouncer: from this box only (loopback and the pinned compose subnet).
host    <APP_DB>     <APP_USER>    127.0.0.1/32          scram-sha-256
host    <APP_DB>     <APP_USER>    <COMPOSE_SUBNET>      scram-sha-256
host    <APP_DB>     <PGBOUNCER_AUTH_USER> <COMPOSE_SUBNET> scram-sha-256
# ACTIVE-ACTIVE only (compose.aa.yml): the PEER's pgbouncer reaches this node's database when this
# node is the primary. App user only, scram, from the two private addresses; never the superuser.
host    <APP_DB>     <APP_USER>    <A_WG_IP>/32          scram-sha-256
host    <APP_DB>     <APP_USER>    <B_WG_IP>/32          scram-sha-256
# Everything else is refused.
host    all          all           0.0.0.0/0             reject
host    all          all           ::/0                  reject
