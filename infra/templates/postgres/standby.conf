# Hot standby (n8n box). Seed once with:
#   pg_basebackup -h <PRIMARY_WG_IP> -U replicator -D <data dir> -R -S standby_kvm8 -X stream -P
# (-R writes standby.signal and primary_conninfo; this file documents the values.)
# Same image and major version as the primary (pg17 + pgvector), plan section 2.

primary_conninfo = 'host=<PRIMARY_WG_IP> port=5432 user=replicator sslmode=require application_name=standby_kvm8'
primary_slot_name = 'standby_kvm8'
hot_standby = on
# Long report queries on the standby (phase B read offload) may delay replay rather than be
# cancelled, up to this bound.
max_standby_streaming_delay = 30s
# Archive fallback if streaming falls behind the slot window.
restore_command = 'wal-g wal-fetch %f %p'
# After promotion this node archives too (same WAL-G target, new timeline).
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 60
