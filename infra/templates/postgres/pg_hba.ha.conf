# Lines ADDED to pg_hba.conf on BOTH nodes (HA-CF-FAILOVER). Only the peer's private (WireGuard)
# address, scram passwords; the replicator role also reads pg_is_in_recovery / LSNs for the
# controller and is granted pg_rewind's functions (see documentation/runbooks/ha-failover.md).
host  replication  replicator  <PEER_WG_IP>/32  scram-sha-256
host  postgres     replicator  <PEER_WG_IP>/32  scram-sha-256
