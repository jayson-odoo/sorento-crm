# India box only: n8n follows whichever CRM node leads (plan section 2 "Where each client connects").
#
# n8n's containers map BOTH <CRM_DOMAIN> and crm-private.internal to ${CRM_PRIVATE_IP}
# (documentation/runbooks/n8n-private-path.md:400-410) and use :443 (API), :8765 (MCP) and :6432
# (DB, sorento-crm-db). Set CRM_PRIVATE_IP to <HAPROXY_BIND_IP> (the docker bridge gateway of the
# n8n network) once, and every port below follows the primary with no further .env flip.
# The local nginx must then listen on the public address only, not 0.0.0.0:443, or the two clash.
#
# Run HAProxy with `network_mode: host` so 127.0.0.1 below is the host's published ports.
# Health: every backend is checked on its node's Patroni REST /primary (GET, unauthenticated,
# 200 only on the leader), so all three ports always move together.
global
  log stdout format raw local0
defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 120s
  timeout server 120s
  default-server inter 3s fall 2 rise 2
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200

frontend crm_api
  bind <HAPROXY_BIND_IP>:443
  default_backend crm_api_nodes
backend crm_api_nodes
  # TLS passes through: each node's nginx serves the <CRM_DOMAIN> certificate.
  server in_local <IN_PUBLIC_BIND>:443 check addr 127.0.0.1 port 8008
  server kl <KL_WG_IP>:443 check addr <KL_WG_IP> port 8008

frontend crm_mcp
  bind <HAPROXY_BIND_IP>:8765
  default_backend crm_mcp_nodes
backend crm_mcp_nodes
  server in_local 127.0.0.1:8765 check addr 127.0.0.1 port 8008
  server kl <KL_WG_IP>:8765 check addr <KL_WG_IP> port 8008

frontend crm_db
  bind <HAPROXY_BIND_IP>:6432
  default_backend crm_db_nodes
backend crm_db_nodes
  # Pooled n8n DB connections sit idle between executions; do not cut them at 120 s.
  timeout tunnel 1h
  on-marked-down shutdown-sessions
  server in_local 127.0.0.1:6432 check addr 127.0.0.1 port 8008
  server kl <KL_WG_IP>:6432 check addr <KL_WG_IP> port 8008
