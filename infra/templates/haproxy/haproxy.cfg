# India box only: n8n and MCP follow whichever CRM node leads (plan section 2).
# n8n's extra_hosts maps crm-private.internal to this HAProxy; no .env flip on failover.
global
  log stdout format raw local0
defaults
  log global
  timeout connect 5s
  timeout client 120s
  timeout server 120s
  default-server inter 3s fall 2 rise 2

# CRM API (HTTP). Same check as the Cloudflare LB: 200 only where the DB leads.
frontend crm_api
  bind 127.0.0.1:8443
  bind <DOCKER_BRIDGE_IP>:8443
  mode tcp
  default_backend crm_api_nodes
backend crm_api_nodes
  mode tcp
  option httpchk
  http-check send meth GET uri /api/v1/health/role hdr Host <CRM_PUBLIC_HOST>
  http-check expect status 200
  server in_local 127.0.0.1:443 check check-ssl verify none port 443
  server kl <KL_WG_IP>:443 check check-ssl verify none port 443

# CRM Postgres for the n8n sorento-crm-db credential: Patroni REST /primary decides.
frontend crm_db
  bind <DOCKER_BRIDGE_IP>:5433
  mode tcp
  default_backend crm_db_nodes
backend crm_db_nodes
  mode tcp
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  on-marked-down shutdown-sessions
  server in_local 127.0.0.1:5432 check port 8008
  server kl <KL_WG_IP>:5432 check addr <KL_WG_IP> port 8008
