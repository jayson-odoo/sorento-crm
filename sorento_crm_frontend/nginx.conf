# SIGN-TOKEN-LOG-REDACT: a customer link (sign page, idea, ticket draft, supplier request,
# onboarding, file link, any ?token=) is a bearer credential, so the access log masks the token
# path segment, drops a query that carries a token, and drops a Referer that is such a link.
map $request_uri $redacted_path {
    "~^(?<rp_pre>(?:/api/v1/public)?(?:/c/[^/?]+)?/(?:quotation-sign|ticket-drafts|portal/ticket-draft|supplier-request|portal/ideas|file-links|onboarding|f)/)[^/?]+(?<rp_rest>[^?]*)" "${rp_pre}[redacted]${rp_rest}";
    "~^(?<rp_path>[^?]*)" $rp_path;
}
map $args $redacted_query {
    "" "";
    "~*token=" "?[redacted]";
    default "?$args";
}
map $http_referer $redacted_referer {
    "~*(token=|/quotation-sign/|/ticket-draft|/supplier-request/|/portal/ideas/|/file-links/|/onboarding/|//[^/]+/f/)" "[redacted]";
    default $http_referer;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $redacted_path$redacted_query $server_protocol" '
                    '$status $body_bytes_sent "$redacted_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    access_log /var/log/nginx/access.log redacted;

    # Allow large uploads (e.g. attachments); default is 1m
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Next.js handles its own API routes (auth, user-management, etc.)
    # Proxy only business logic API requests to backend
    # Exclude /api/auth/* which is handled by Next.js NextAuth
    location ~ ^/api/auth {
        # Let Next.js handle auth routes
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy business logic API requests to backend (only /api/v1/* should go here)
    # For now, we're keeping other /api/* routes in Next.js
    # You can add more specific patterns here if needed
    location /api/v1/ {
        client_max_body_size 50m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long-running requests (file uploads, etc.)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Increase buffer sizes for large requests
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Serve static files from Next.js build
    location /_next/static/ {
        alias /app/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Serve public files
    location /public/ {
        alias /app/public/;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Serve media files (fonts, images, etc.)
    location /_next/static/media/ {
        alias /app/.next/static/media/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all requests to Next.js server (except /api which goes to backend)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
